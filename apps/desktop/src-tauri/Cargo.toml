[package]
name = "clusteryourcodex-desktop-host"
version = "0.1.0-preview.59"
description = "Security boundary and native host for ClusterYourCodex"
authors = ["ClusterYourCodex contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TypeThe0ry/ClusterYourCodex"
rust-version = "1.88.0"

[lib]
name = "clusteryourcodex_desktop_host"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ClusterYourCodex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cyc-protocol = { path = "../../../crates/cyc-protocol" }
cyc-provision = { path = "../../../crates/cyc-provision" }
cyc-secrets = { path = "../../../crates/cyc-secrets" }
cyc-ssh = { path = "../../../crates/cyc-ssh" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tar = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
zstd = "0.13"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading"] }

# Keep the native host independently buildable without changing the root Rust
# workspace membership. The root workspace owns controller and worker crates.
[workspace]
