name: Developer-preview release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CYC_REF_NAME: ${{ github.ref_name }}

jobs:
  rust-artifacts:
    name: ${{ matrix.name }} portable preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            platform: windows
            native_arch: x86_64
            suffix: .exe
            include_worker: "true"
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            platform: linux
            native_arch: x86_64
            suffix: ""
            include_worker: "true"
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
            platform: macos
            native_arch: x86_64
            suffix: ""
            include_worker: "false"
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
            platform: macos
            native_arch: arm64
            suffix: ""
            include_worker: "false"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-preview-${{ matrix.target }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint full Rust workspace
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Test full Rust workspace
        run: cargo test --workspace --locked --target ${{ matrix.target }} -- --test-threads=1
      - name: Build native release binaries
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          --bin cyc-controller --bin cyc-worker --bin cyc
      - name: Verify Windows x64 binaries and native smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
              [Runtime.InteropServices.Architecture]::X64) {
            throw "Expected a native Windows x64 runner."
          }
          foreach ($name in @('cyc-controller.exe', 'cyc-worker.exe', 'cyc.exe')) {
            $path = Join-Path $PWD "target/${{ matrix.target }}/release/$name"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release binary: $path"
            }
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "$name is not a PE executable."
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
                [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") {
              throw "$name has an invalid PE header."
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw "$name is not an AMD64 PE executable (machine=0x$($machine.ToString('x4')))."
            }
            & $path --version
            if ($LASTEXITCODE -ne 0) { throw "$name --version failed." }
            & $path --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$name --help failed." }
          }
      - name: Verify Linux x64 binaries, executable bits, and native smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]]
          for name in cyc-controller cyc-worker cyc; do
            path="target/${{ matrix.target }}/release/$name"
            test -f "$path"
            test -x "$path"
            file "$path" | grep -Eq 'ELF 64-bit.*x86-64'
            readelf -h "$path" | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'
            "$path" --version
            "$path" --help >/dev/null
          done
      - name: Verify macOS binaries, executable bits, and native smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "${{ matrix.native_arch }}" ]]
          for name in cyc-controller cyc; do
            path="target/${{ matrix.target }}/release/$name"
            test -f "$path"
            test -x "$path"
            file "$path" | grep -q 'Mach-O 64-bit executable'
            archs="$(lipo -archs "$path")"
            case " $archs " in
              *" ${{ matrix.native_arch }} "*) ;;
              *) echo "Unexpected Mach-O architectures for $name: $archs" >&2; exit 1 ;;
            esac
            "$path" --version
            "$path" --help >/dev/null
          done
      - name: Materialize worker-kit publisher key
        if: matrix.include_worker == 'true'
        shell: pwsh
        env:
          CYC_SIGNING_KEY_PEM_B64: ${{ secrets.CYC_WORKER_KIT_SIGNING_KEY_PEM_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace([string]$env:CYC_SIGNING_KEY_PEM_B64)) {
            throw 'CYC_WORKER_KIT_SIGNING_KEY_PEM_B64 is required; unsigned worker kits are forbidden.'
          }
          try {
            $bytes = [Convert]::FromBase64String([string]$env:CYC_SIGNING_KEY_PEM_B64)
          } catch {
            throw 'CYC_WORKER_KIT_SIGNING_KEY_PEM_B64 is not valid Base64.'
          }
          if ($bytes.Length -lt 64 -or $bytes.Length -gt 65536) {
            throw 'Worker-kit signing key length is invalid.'
          }
          $path = Join-Path $env:RUNNER_TEMP "cyc-worker-kit-signing-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-${{ matrix.label }}.pem"
          [IO.File]::WriteAllBytes($path, $bytes)
          "CYC_WORKER_KIT_SIGNING_KEY_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Stage portable developer-preview archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $safeRef = [string]$env:CYC_REF_NAME -replace '[^0-9A-Za-z._-]', '-'
          if ([string]::IsNullOrWhiteSpace($safeRef)) { $safeRef = 'build' }
          $name = "ClusterYourCodex-$safeRef-${{ matrix.label }}-preview"
          $stage = Join-Path $PWD "release-stage/$name"
          $bin = Join-Path $stage 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          $binaryNames = @('cyc-controller', 'cyc')
          if ('${{ matrix.include_worker }}' -eq 'true') {
            $binaryNames = @('cyc-controller', 'cyc-worker', 'cyc')
          }
          foreach ($binary in $binaryNames) {
            $source = Join-Path $PWD "target/${{ matrix.target }}/release/$binary${{ matrix.suffix }}"
            $destination = Join-Path $bin "$binary${{ matrix.suffix }}"
            Copy-Item -LiteralPath $source -Destination $destination
            if ('${{ runner.os }}' -ne 'Windows') {
              & chmod 'u+x' $destination
              if ($LASTEXITCODE -ne 0) { throw "chmod failed for $destination" }
            }
          }

          if ('${{ matrix.include_worker }}' -eq 'true') {
            $workerKitTarget = if ('${{ matrix.platform }}' -eq 'windows') {
              'windows-x86_64'
            } else {
              'linux-x86_64'
            }
            $workerKit = Join-Path $stage 'worker-kit'
            $workerSource = Join-Path $PWD "target/${{ matrix.target }}/release/cyc-worker${{ matrix.suffix }}"
            & ./packaging/worker-kits/New-WorkerKit.ps1 `
              -Target $workerKitTarget `
              -WorkerExecutable $workerSource `
              -OutputDirectory $workerKit
            if ($LASTEXITCODE -ne 0) { throw 'Worker-kit generation failed.' }
            if ('${{ runner.os }}' -ne 'Windows') {
              foreach ($path in @(
                (Join-Path $workerKit 'cyc-worker'),
                (Join-Path $workerKit 'install-worker.sh')
              )) {
                & chmod 'u+x' $path
                if ($LASTEXITCODE -ne 0) { throw "chmod failed for $path" }
              }
            }
          }
          Copy-Item -LiteralPath README.md, LICENSE -Destination $stage

          $managedState = if ('${{ matrix.include_worker }}' -eq 'true') {
            'developer-preview-enabled-for-trusted-single-user-jobs'
          } else {
            'disabled-worker-omitted'
          }
          $managedReason = if ('${{ matrix.include_worker }}' -eq 'true') {
            'The archive contains cyc-worker. It executes native scripts as the worker account and is not a hostile-workload or multi-tenant sandbox.'
          } else {
            'The macOS archive is controller/CLI-only. Managed execution fail-closes until macOS has a containment backend that can prove the complete process tree is gone.'
          }
          $notice = @"
          # ClusterYourCodex developer preview

          This is a code-unsigned, unattested portable developer-preview archive, not a stable installer.
          Included Windows/Linux worker kits carry a controller-verified Ed25519 publisher signature.

          Platform: ${{ matrix.platform }}
          Architecture: ${{ matrix.native_arch }}
          Contents: $($binaryNames -join ', ')

          $managedReason

          Verify the adjacent `.sha256` sidecar or the workflow-level `SHA256SUMS`
          before extracting. No code-signing, notarization, SBOM, or provenance is
          claimed by this archive. Windows and Linux archives include an explicit
          worker-kit lifecycle script with install, repair, uninstall, and rollback
          support; nothing runs automatically when the archive is extracted.
          "@
          $notice | Set-Content -LiteralPath (Join-Path $stage 'PREVIEW-NOTICE.md') -Encoding UTF8

          $platformStatus = [ordered]@{
            schemaVersion = 'cyc.dev/platform-status/v1'
            releaseKind = 'developer-preview'
            platform = '${{ matrix.platform }}'
            architecture = '${{ matrix.native_arch }}'
            rustTarget = '${{ matrix.target }}'
            portableArchive = $true
            nativeRunner = '${{ matrix.os }}'
            binaries = $binaryNames
            workerKitIncluded = ('${{ matrix.include_worker }}' -eq 'true')
            managedExecution = [ordered]@{
              workerIncluded = ('${{ matrix.include_worker }}' -eq 'true')
              state = $managedState
              reason = $managedReason
            }
            securityClaims = [ordered]@{
              codeSigned = $false
              notarized = $false
              attested = $false
              sbomIncluded = $false
            }
          }
          $platformStatus | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $stage 'platform-status.json') -Encoding UTF8

          $payloadFiles = @(Get-ChildItem -LiteralPath $stage -File -Recurse -Force |
            Sort-Object FullName | ForEach-Object {
              [ordered]@{
                path = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
                length = [long]$_.Length
                sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              }
            })
          $manifest = [ordered]@{
            schemaVersion = 'cyc.dev/release-manifest/v1'
            releaseKind = 'developer-preview'
            sourceCommit = [string]$env:GITHUB_SHA
            sourceRef = [string]$env:GITHUB_REF
            target = '${{ matrix.target }}'
            files = $payloadFiles
          }
          $manifest | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $stage 'release-manifest.json') -Encoding UTF8

          $archiveRoot = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force -Path $archiveRoot | Out-Null
          if ('${{ runner.os }}' -eq 'Windows') {
            $archive = Join-Path $archiveRoot "$name.zip"
            Compress-Archive -LiteralPath $stage -DestinationPath $archive
          } else {
            $archive = Join-Path $archiveRoot "$name.tar.gz"
            & tar -C (Split-Path $stage -Parent) -czf $archive (Split-Path $stage -Leaf)
            if ($LASTEXITCODE -ne 0) { throw 'tar failed to create the portable preview.' }
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" |
            Set-Content -NoNewline -Encoding ascii "$archive.sha256"
      - name: Destroy worker-kit publisher key
        if: always() && matrix.include_worker == 'true'
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace([string]$env:CYC_WORKER_KIT_SIGNING_KEY_PATH)) {
            [IO.File]::Delete([string]$env:CYC_WORKER_KIT_SIGNING_KEY_PATH)
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ClusterYourCodex-${{ matrix.label }}-preview
          path: release-assets/*
          if-no-files-found: error
      - name: Upload managed worker kit for controller aggregation
        if: matrix.include_worker == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ClusterYourCodex-worker-kit-${{ matrix.label }}
          path: release-stage/*/worker-kit/*
          if-no-files-found: error

  linux-arm64-worker-kit:
    name: Linux arm64 managed worker kit
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-preview-aarch64-unknown-linux-gnu
      - name: Install Linux arm64 cross linker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build Linux arm64 worker
        shell: bash
        run: >-
          cargo build --locked --release --target aarch64-unknown-linux-gnu
          --package cyc-worker
      - name: Materialize worker-kit publisher key
        shell: pwsh
        env:
          CYC_SIGNING_KEY_PEM_B64: ${{ secrets.CYC_WORKER_KIT_SIGNING_KEY_PEM_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace([string]$env:CYC_SIGNING_KEY_PEM_B64)) {
            throw 'CYC_WORKER_KIT_SIGNING_KEY_PEM_B64 is required; unsigned worker kits are forbidden.'
          }
          try {
            $bytes = [Convert]::FromBase64String([string]$env:CYC_SIGNING_KEY_PEM_B64)
          } catch {
            throw 'CYC_WORKER_KIT_SIGNING_KEY_PEM_B64 is not valid Base64.'
          }
          if ($bytes.Length -lt 64 -or $bytes.Length -gt 65536) {
            throw 'Worker-kit signing key length is invalid.'
          }
          $path = Join-Path $env:RUNNER_TEMP "cyc-worker-kit-signing-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-linux-arm64.pem"
          [IO.File]::WriteAllBytes($path, $bytes)
          "CYC_WORKER_KIT_SIGNING_KEY_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify Linux arm64 worker and stage kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = Join-Path $PWD 'target/aarch64-unknown-linux-gnu/release/cyc-worker'
          if (-not (Test-Path -LiteralPath $worker -PathType Leaf)) {
            throw "Missing cross-compiled worker: $worker"
          }
          $elfHeader = @(& readelf -h $worker 2>&1)
          if ($LASTEXITCODE -ne 0 -or -not ($elfHeader -match 'Machine:\s+AArch64')) {
            throw 'The cross-compiled worker is not a Linux AArch64 ELF.'
          }
          & ./packaging/worker-kits/New-WorkerKit.ps1 `
            -Target linux-aarch64 `
            -WorkerExecutable $worker `
            -OutputDirectory (Join-Path $PWD 'worker-kit-artifact')
          if ($LASTEXITCODE -ne 0) { throw 'Linux arm64 worker-kit generation failed.' }
          foreach ($path in @(
            (Join-Path $PWD 'worker-kit-artifact/cyc-worker'),
            (Join-Path $PWD 'worker-kit-artifact/install-worker.sh')
          )) {
            & chmod 'u+x' $path
            if ($LASTEXITCODE -ne 0) { throw "chmod failed for $path" }
          }
          & bash -n (Join-Path $PWD 'worker-kit-artifact/install-worker.sh')
          if ($LASTEXITCODE -ne 0) { throw 'Linux arm64 lifecycle script failed syntax validation.' }
      - name: Destroy worker-kit publisher key
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace([string]$env:CYC_WORKER_KIT_SIGNING_KEY_PATH)) {
            [IO.File]::Delete([string]$env:CYC_WORKER_KIT_SIGNING_KEY_PATH)
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ClusterYourCodex-worker-kit-linux-arm64
          path: worker-kit-artifact/*
          if-no-files-found: error

  integration-artifact:
    name: Desktop renderer and Codex plugin preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-integration-preview
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint full Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test full Rust workspace
        run: cargo test --workspace --locked -- --test-threads=1
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Stage integration preview bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $safeRef = [string]$env:CYC_REF_NAME -replace '[^0-9A-Za-z._-]', '-'
          if ([string]::IsNullOrWhiteSpace($safeRef)) { $safeRef = 'build' }
          $name = "ClusterYourCodex-$safeRef-integration-preview"
          $stage = Join-Path $PWD "release-stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath README.md, LICENSE -Destination $stage
          Copy-Item -Recurse -LiteralPath apps/desktop/dist -Destination (Join-Path $stage 'desktop')
          $marketplace = Join-Path $stage 'marketplace'
          $plugin = Join-Path $marketplace 'plugins/cluster-your-codex'
          New-Item -ItemType Directory -Force -Path $plugin | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $marketplace '.agents/plugins') | Out-Null
          Copy-Item -LiteralPath .agents/plugins/marketplace.json -Destination (Join-Path $marketplace '.agents/plugins/marketplace.json')
          Copy-Item -Recurse -LiteralPath plugins/cluster-your-codex/.codex-plugin -Destination $plugin
          Copy-Item -Recurse -LiteralPath plugins/cluster-your-codex/skills -Destination $plugin
          Copy-Item -LiteralPath plugins/cluster-your-codex/.mcp.json -Destination $plugin
          pnpm --filter @clusteryourcodex/codex-mcp deploy --prod --legacy (Join-Path $plugin 'mcp')
          if ($LASTEXITCODE -ne 0) { throw 'failed to deploy MCP production dependencies' }

          @'
          # ClusterYourCodex integration developer preview

          This archive contains the compiled renderer and Codex marketplace/plugin assets.
          It is not a native desktop application, controller, worker, CLI, or installer.
          The MCP bridge in this archive requires Node.js 20 or newer on PATH.
          It is code-unsigned and unattested, and does not claim an SBOM or provenance.
          '@ | Set-Content -LiteralPath (Join-Path $stage 'PREVIEW-NOTICE.md') -Encoding UTF8
          [ordered]@{
            schemaVersion = 'cyc.dev/platform-status/v1'
            releaseKind = 'developer-preview'
            platform = 'integration-assets'
            architecture = 'platform-neutral-renderer-and-plugin'
            portableArchive = $true
            nativeApplicationIncluded = $false
            managedExecution = [ordered]@{
              workerIncluded = $false
              state = 'not-applicable'
            }
            securityClaims = [ordered]@{
              codeSigned = $false
              notarized = $false
              attested = $false
              sbomIncluded = $false
            }
          } | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $stage 'platform-status.json') -Encoding UTF8

          $payloadFiles = @(Get-ChildItem -LiteralPath $stage -File -Recurse -Force |
            Sort-Object FullName | ForEach-Object {
              [ordered]@{
                path = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
                length = [long]$_.Length
                sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              }
            })
          [ordered]@{
            schemaVersion = 'cyc.dev/release-manifest/v1'
            releaseKind = 'developer-preview'
            sourceCommit = [string]$env:GITHUB_SHA
            sourceRef = [string]$env:GITHUB_REF
            target = 'integration-assets'
            files = $payloadFiles
          } | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $stage 'release-manifest.json') -Encoding UTF8

          $archiveRoot = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force -Path $archiveRoot | Out-Null
          $archive = Join-Path $archiveRoot "$name.zip"
          Compress-Archive -LiteralPath $stage -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" |
            Set-Content -NoNewline -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ClusterYourCodex-integration-preview
          path: release-assets/*
          if-no-files-found: error

  windows-preview:
    name: Windows x64 self-contained preview
    needs: [rust-artifacts, linux-arm64-worker-kit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download cross-platform managed worker kits
        uses: actions/download-artifact@v4
        with:
          pattern: ClusterYourCodex-worker-kit-*
          path: ${{ runner.temp }}\cyc-managed-worker-kits
          merge-multiple: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-self-contained-preview
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint full Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test full Rust workspace
        run: cargo test --workspace --locked -- --test-threads=1
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Validate Windows install lifecycle
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .\packaging\windows\Test-WindowsPackaging.ps1
      - name: Validate managed worker kits
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .\packaging\worker-kits\Test-WorkerKits.ps1
      - name: Install NSIS setup compiler
        shell: powershell
        run: choco install nsis --yes --no-progress
      - run: pnpm -r build
      - run: cargo build --locked --release --bin cyc-controller --bin cyc-worker --bin cyc
      - run: pnpm --filter @clusteryourcodex/desktop exec tauri build --no-bundle
      - name: Verify self-contained preview native binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne
              [Runtime.InteropServices.Architecture]::X64) {
            throw 'Expected a native Windows x64 runner.'
          }
          $binaries = @(
            (Join-Path $PWD 'target/release/cyc-controller.exe'),
            (Join-Path $PWD 'target/release/cyc-worker.exe'),
            (Join-Path $PWD 'target/release/cyc.exe'),
            (Join-Path $PWD 'apps/desktop/src-tauri/target/release/ClusterYourCodex.exe')
          )
          foreach ($path in $binaries) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release binary: $path"
            }
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "$path is not a PE executable."
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
                [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") {
              throw "$path has an invalid PE header."
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw "$path is not an AMD64 PE executable (machine=0x$($machine.ToString('x4')))."
            }
          }
          foreach ($path in $binaries[0..2]) {
            & $path --version
            if ($LASTEXITCODE -ne 0) { throw "$path --version failed." }
            & $path --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$path --help failed." }
          }
      - name: Stage self-contained Windows developer preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-ValidatedNodeExecutable {
            param(
              [string]$ExpectedVersion = 'v24.19.0',
              [string]$ExpectedArchitecture = 'x64'
            )

            $commands = @(Get-Command -Name 'node.exe' -CommandType Application -All -ErrorAction Stop)
            $seen = @{}
            $observed = New-Object System.Collections.Generic.List[string]
            foreach ($command in $commands) {
              $candidate = [string]$command.Path
              if ([string]::IsNullOrWhiteSpace($candidate)) {
                $candidate = [string]$command.Source
              }
              if ([string]::IsNullOrWhiteSpace($candidate) -or
                  -not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                continue
              }

              $resolved = [string](Resolve-Path -LiteralPath $candidate -ErrorAction Stop).ProviderPath
              if ([System.IO.Path]::GetFileName($resolved) -ine 'node.exe' -or $seen.ContainsKey($resolved)) {
                continue
              }
              $seen[$resolved] = $true

              try {
                $identityOutput = @(& $resolved --print 'JSON.stringify({version:process.version,architecture:process.arch})' 2>&1)
                $identityExitCode = $LASTEXITCODE
                $identity = (($identityOutput | ForEach-Object { [string]$_ }) -join '').Trim() | ConvertFrom-Json
                $version = [string]$identity.version
                $architecture = [string]$identity.architecture
                [void]$observed.Add("$resolved ($version, $architecture, exit $identityExitCode)")
                if ($identityExitCode -eq 0 -and
                    $version -eq $ExpectedVersion -and
                    $architecture -eq $ExpectedArchitecture) {
                  return $resolved
                }
              } catch {
                [void]$observed.Add("$resolved (identity probe failed: $($_.Exception.Message))")
              }
            }

            $details = if ($observed.Count -gt 0) { $observed -join '; ' } else { 'no usable node.exe candidates' }
            throw "No node.exe Application matched Node.js $ExpectedVersion/$ExpectedArchitecture. Observed: $details"
          }

          $mcpDeploy = Join-Path $env:RUNNER_TEMP "cyc-mcp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          pnpm --filter @clusteryourcodex/codex-mcp deploy --prod --legacy $mcpDeploy
          if ($LASTEXITCODE -ne 0) { throw 'failed to deploy MCP production dependencies' }

          $node = Get-ValidatedNodeExecutable
          $nodeLicense = Join-Path (Split-Path -Parent $node) 'LICENSE'
          if (-not (Test-Path -LiteralPath $nodeLicense -PathType Leaf)) {
            throw "actions/setup-node runtime did not include its LICENSE at $nodeLicense"
          }

          $safeRef = [string]$env:CYC_REF_NAME -replace '[^0-9A-Za-z._-]', '-'
          if ([string]::IsNullOrWhiteSpace($safeRef)) { $safeRef = 'build' }
          $name = "ClusterYourCodex-$safeRef-windows-x64-self-contained-preview"
          $preview = Join-Path $env:RUNNER_TEMP $name
          $workerKits = Join-Path $env:RUNNER_TEMP 'cyc-managed-worker-kits'
          & .\packaging\windows\New-PreviewPayload.ps1 `
            -McpDeployRoot $mcpDeploy `
            -NodeExecutable $node `
            -NodeLicense $nodeLicense `
            -WorkerKitsRoot $workerKits `
            -OutputRoot $preview
          if ($LASTEXITCODE -ne 0) { throw 'failed to stage Windows preview payload' }

          @'
          # ClusterYourCodex Windows developer preview

          This self-contained ZIP contains the Windows GUI, controller, local managed
          worker, CLI, per-user bootstrap lifecycle, Codex marketplace/plugin, private
          Node runtime, and integrity-bound Windows x64/Linux x64/Linux arm64 worker
          kits for SSH provisioning. It is a developer preview for trusted single-user
          jobs. Submitted steps execute as the worker account; this is not a
          hostile-workload sandbox.

          The job also publishes a code-unsigned one-click NSIS Setup.exe built from this
          exact manifest-bound payload. The ZIP, bootstrap, and Setup.exe are code-unsigned
          and unattested; no SBOM, provenance, automatic update, or stable-release
          support is claimed. Managed Worker Kits inside the payload have detached
          Ed25519 publisher signatures. The installer registers its own repair-safe uninstaller.
          '@ | Set-Content -LiteralPath (Join-Path $preview 'PREVIEW-NOTICE.md') -Encoding UTF8
          [ordered]@{
            schemaVersion = 'cyc.dev/platform-status/v1'
            releaseKind = 'developer-preview'
            platform = 'windows'
            architecture = 'x86_64'
            rustTarget = 'x86_64-pc-windows-msvc'
            package = 'self-contained-bootstrap-zip-and-nsis-setup'
            nativeRunner = 'windows-latest'
            binaries = @('ClusterYourCodex.exe', 'cyc-controller.exe', 'cyc-worker.exe', 'cyc.exe')
            workerKits = @('windows-x86_64', 'linux-x86_64', 'linux-aarch64')
            managedExecution = [ordered]@{
              workerIncluded = $true
              state = 'developer-preview-enabled-for-trusted-single-user-jobs'
              containment = 'Windows Job Object with kill-on-close'
            }
            securityClaims = [ordered]@{
              codeSigned = $false
              notarized = $false
              attested = $false
              sbomIncluded = $false
            }
          } | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $preview 'platform-status.json') -Encoding UTF8

          $oldChecksums = Join-Path $preview 'SHA256SUMS'
          if (Test-Path -LiteralPath $oldChecksums -PathType Leaf) {
            Remove-Item -LiteralPath $oldChecksums -Force
          }
          $payloadFiles = @(Get-ChildItem -LiteralPath $preview -File -Recurse -Force |
            Where-Object Name -ne 'release-manifest.json' |
            Sort-Object FullName | ForEach-Object {
              [ordered]@{
                path = $_.FullName.Substring($preview.Length + 1).Replace('\', '/')
                length = [long]$_.Length
                sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              }
            })
          [ordered]@{
            schemaVersion = 'cyc.dev/release-manifest/v1'
            releaseKind = 'developer-preview'
            sourceCommit = [string]$env:GITHUB_SHA
            sourceRef = [string]$env:GITHUB_REF
            target = 'x86_64-pc-windows-msvc-self-contained'
            files = $payloadFiles
          } | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $preview 'release-manifest.json') -Encoding UTF8
          $checksumRecords = @(Get-ChildItem -LiteralPath $preview -File -Recurse -Force |
            Where-Object Name -ne 'SHA256SUMS' |
            Sort-Object FullName | ForEach-Object {
              $relative = $_.FullName.Substring($preview.Length + 1).Replace('\', '/')
              $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$digest  $relative"
            })
          $checksumRecords | Set-Content -LiteralPath $oldChecksums -Encoding ASCII

          $archiveRoot = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force -Path $archiveRoot | Out-Null
          $setup = Join-Path $archiveRoot 'ClusterYourCodex-Setup.exe'
          $makeNsis = $null
          $nsisRoots = @(
            [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86),
            [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFiles),
            [string]${env:ProgramFiles(x86)},
            [string]$env:ProgramFiles
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          foreach ($nsisRoot in $nsisRoots) {
            $candidate = Join-Path -Path $nsisRoot.Trim() -ChildPath 'NSIS\makensis.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $makeNsis = [string](Resolve-Path -LiteralPath $candidate -ErrorAction Stop).ProviderPath
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($makeNsis)) {
            throw 'NSIS installation completed but makensis.exe was not found in a standard Program Files location.'
          }
          & .\packaging\windows\New-SetupExecutable.ps1 `
            -PackageRoot $preview `
            -OutputPath $setup `
            -MakeNsisPath $makeNsis `
            -Force
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'failed to build ClusterYourCodex-Setup.exe'
          }
          $archive = Join-Path $archiveRoot "$name.zip"
          Compress-Archive -LiteralPath $preview -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" |
            Set-Content -NoNewline -Encoding ascii "$archive.sha256"
      - name: Run fresh deployment lifecycle smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $safeRef = [string]$env:CYC_REF_NAME -replace '[^0-9A-Za-z._-]', '-'
          if ([string]::IsNullOrWhiteSpace($safeRef)) { $safeRef = 'build' }
          $preview = Join-Path $env:RUNNER_TEMP "ClusterYourCodex-$safeRef-windows-x64-self-contained-preview"
          & .\packaging\windows\Test-FreshDeployment.ps1 -PackageRoot $preview
          if ($LASTEXITCODE -ne 0) { throw 'fresh deployment lifecycle smoke failed' }
      - name: Run silent Setup lifecycle smoke in disposable runner
        shell: pwsh
        env:
          CYC_DISPOSABLE_WINDOWS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $safeRef = [string]$env:CYC_REF_NAME -replace '[^0-9A-Za-z._-]', '-'
          if ([string]::IsNullOrWhiteSpace($safeRef)) { $safeRef = 'build' }
          $preview = Join-Path $env:RUNNER_TEMP "ClusterYourCodex-$safeRef-windows-x64-self-contained-preview"
          $setup = Join-Path $PWD 'release-assets\ClusterYourCodex-Setup.exe'
          $work = Join-Path $env:RUNNER_TEMP 'ClusterYourCodex-setup-silent-smoke'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell `
            -NoLogo `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File .\packaging\windows\Test-SetupSilent.ps1 `
            -SetupPath $setup `
            -PackageRoot $preview `
            -WorkRoot $work `
            -DisposableEnvironment `
            -KeepWorkRoot
          if ($LASTEXITCODE -ne 0) { throw 'silent Setup lifecycle smoke failed' }
      - name: Upload silent Setup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClusterYourCodex-windows-setup-silent-diagnostics
          path: ${{ runner.temp }}\ClusterYourCodex-setup-silent-smoke\**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ClusterYourCodex-windows-x64-self-contained-preview
          path: release-assets/*
          if-no-files-found: error

  release-index:
    name: Verify preview sidecars and build release index
    needs: [rust-artifacts, integration-artifact, windows-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Verify sidecars and assemble indexed release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputRoot = Join-Path $PWD 'downloaded-artifacts'
          $outputRoot = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          $sidecars = @(Get-ChildItem -LiteralPath $inputRoot -File -Recurse -Filter '*.sha256' |
            Sort-Object FullName)
          if ($sidecars.Count -ne 7) {
            throw "Expected seven preview artifact sidecars, found $($sidecars.Count)."
          }

          $records = New-Object System.Collections.Generic.List[object]
          $names = @{}
          foreach ($sidecar in $sidecars) {
            $line = (Get-Content -LiteralPath $sidecar.FullName -Raw).Trim()
            if ($line -notmatch '^(?<hash>[0-9a-fA-F]{64})  (?<name>[^/\\\r\n]+)$') {
              throw "Malformed checksum sidecar: $($sidecar.FullName)"
            }
            $expectedHash = $Matches.hash.ToLowerInvariant()
            $archiveName = $Matches.name
            $sidecarArchiveName = $sidecar.Name.Substring(0, $sidecar.Name.Length - '.sha256'.Length)
            if ($archiveName -cne $sidecarArchiveName) {
              throw "Sidecar filename mismatch: $($sidecar.Name) declares $archiveName"
            }
            if ($names.ContainsKey($archiveName.ToLowerInvariant())) {
              throw "Duplicate release asset name: $archiveName"
            }
            $names[$archiveName.ToLowerInvariant()] = $true
            $archive = Join-Path $sidecar.DirectoryName $archiveName
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Sidecar target is missing: $archive"
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            if ($actualHash -cne $expectedHash) {
              throw "SHA-256 mismatch for $archiveName"
            }
            Copy-Item -LiteralPath $archive, $sidecar.FullName -Destination $outputRoot
            [void]$records.Add([ordered]@{
              name = $archiveName
              bytes = [long](Get-Item -LiteralPath $archive).Length
              sha256 = $actualHash
              sidecar = "$archiveName.sha256"
            })
          }

          $requiredSuffixes = @(
            '-windows-x64-preview.zip',
            '-linux-x64-preview.tar.gz',
            '-macos-x64-preview.tar.gz',
            '-macos-arm64-preview.tar.gz',
            '-integration-preview.zip',
            '-windows-x64-self-contained-preview.zip',
            'ClusterYourCodex-Setup.exe'
          )
          foreach ($suffix in $requiredSuffixes) {
            $matches = @($records | Where-Object { $_.name.EndsWith($suffix, [StringComparison]::Ordinal) })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one release asset ending in $suffix; found $($matches.Count)."
            }
          }

          $sortedRecords = @($records | Sort-Object name)
          $indexPath = Join-Path $outputRoot 'release-index.json'
          [ordered]@{
            schemaVersion = 'cyc.dev/release-index/v1'
            releaseKind = 'developer-preview'
            sourceCommit = [string]$env:GITHUB_SHA
            sourceRef = [string]$env:GITHUB_REF
            unsigned = $true
            unattested = $true
            artifacts = $sortedRecords
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $indexPath -Encoding UTF8
          $indexHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $indexPath).Hash.ToLowerInvariant()
          "$indexHash  release-index.json" |
            Set-Content -NoNewline -Encoding ASCII (Join-Path $outputRoot 'release-index.json.sha256')
          $combined = @($sortedRecords | ForEach-Object { "$($_.sha256)  $($_.name)" })
          $combined += "$indexHash  release-index.json"
          $combined | Set-Content -LiteralPath (Join-Path $outputRoot 'SHA256SUMS') -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: ClusterYourCodex-release-index-preview
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: Create tagged draft developer preview
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-index]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClusterYourCodex-release-index-preview
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
