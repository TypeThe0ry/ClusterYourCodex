name: Windows Setup acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/setup-acceptance.yml'
      - 'packaging/windows/**'
      - 'scripts/Prepare-NativeCodexPlugin.ps1'
      - 'scripts/Test-NativeCodexPlugin.ps1'
      - 'scripts/Install-NativeCodexPlugin.ps1'
      - 'scripts/Remove-LegacyCodexSkills.ps1'
      - 'scripts/Test-NativeCodexPluginContract.ps1'

permissions:
  contents: read

concurrency:
  group: setup-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Packaged silent install and running-controller repair
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: .\scripts\Test-NativeCodexPluginContract.ps1
      - run: pnpm -r build
      - name: Build controller and worker binaries with a bounded process
        run: >-
          ./scripts/Invoke-BoundedWindowsProcess.ps1
          -FilePath (Get-Command cargo.exe -CommandType Application).Source
          -ArgumentList 'build --locked --release -p cyc-cli -p cyc-controller -p cyc-worker'
          -TimeoutSeconds 1500 -WorkingDirectory $PWD -EvidenceRoot $env:RUNNER_TEMP
      # The frontend was built by pnpm -r build above. Build the Tauri Rust
      # target directly so Setup receives the same cyc-desktop.exe without
      # leaving the Tauri CLI wrapper waiting indefinitely on Windows runners.
      - name: Build desktop host with a bounded process
        run: >-
          ./scripts/Invoke-BoundedWindowsProcess.ps1
          -FilePath (Get-Command cargo.exe -CommandType Application).Source
          -ArgumentList 'build --locked --release --manifest-path apps/desktop/src-tauri/Cargo.toml'
          -TimeoutSeconds 1800 -WorkingDirectory $PWD -EvidenceRoot $env:RUNNER_TEMP
      - name: Compile Setup from current source
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $plugin = Join-Path $env:RUNNER_TEMP 'setup-native-plugin'
          $nodeCommand = @(Get-Command node.exe -CommandType Application -All -ErrorAction Stop | Select-Object -First 1)
          if ($nodeCommand.Count -ne 1) { throw 'node.exe was not resolved to exactly one executable' }
          [string]$node = $nodeCommand[0].Source
          $nodeLicense = Join-Path (Split-Path $node -Parent) 'LICENSE'
          if (-not (Test-Path -LiteralPath $nodeLicense -PathType Leaf)) { $nodeLicense = Join-Path $PWD 'packaging/windows/LICENSE.node.txt' }
          ./scripts/Prepare-NativeCodexPlugin.ps1 -OutputRoot $plugin -NodeLicense $nodeLicense
          $nsisCommand = @(Get-Command makensis.exe -CommandType Application -All -ErrorAction SilentlyContinue | Select-Object -First 1)
          $nsis = if ($nsisCommand.Count -eq 1) {
            [string]$nsisCommand[0].Source
          } else {
            $installedNsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
            if (-not (Test-Path -LiteralPath $installedNsis -PathType Leaf)) {
              throw 'makensis.exe was not found after NSIS installation.'
            }
            $installedNsis
          }
          $package = Join-Path $env:RUNNER_TEMP 'setup-package'
          ./packaging/windows/New-PreviewPayload.ps1 `
            -McpDeployRoot (Join-Path $plugin 'plugins/cluster-your-codex/mcp') `
            -NodeExecutable $node `
            -NodeLicense $nodeLicense `
            -OutputRoot $package
          ./packaging/windows/New-SetupExecutable.ps1 `
            -PackageRoot $package `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'ClusterYourCodex-Setup.exe') `
            -MakeNsisPath $nsis
      - name: Run disposable packaged lifecycle
        timeout-minutes: 30
        env:
          CYC_DISPOSABLE_WINDOWS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'setup-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $work = Join-Path $env:TEMP ('clusteryourcodex-setup-silent-' + [Guid]::NewGuid().ToString('N'))
          try {
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File ./packaging/windows/Test-SetupSilent.ps1 `
              -SetupPath (Join-Path $env:RUNNER_TEMP 'ClusterYourCodex-Setup.exe') `
              -PackageRoot (Join-Path $env:RUNNER_TEMP 'setup-package') `
              -WorkRoot $work -LifecycleTimeoutSeconds 1500 `
              -DisposableEnvironment -KeepWorkRoot `
              1> (Join-Path $evidence 'result.json') 2> (Join-Path $evidence 'stderr.log')
            if ($LASTEXITCODE -ne 0) { throw "Setup acceptance failed: exit $LASTEXITCODE" }
          } finally {
            if (Test-Path (Join-Path $work 'cleanup.json')) {
              Copy-Item -LiteralPath (Join-Path $work 'cleanup.json') -Destination $evidence
            }
            git rev-parse HEAD | Set-Content (Join-Path $evidence 'source-commit.txt')
          }
      - name: Retain lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-setup-acceptance
          path: setup-evidence/
          if-no-files-found: warn
