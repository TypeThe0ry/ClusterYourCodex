name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version-identity:
    name: Product version identity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify every remote GitHub Action is commit-pinned
        shell: pwsh
        run: ./scripts/Test-GitHubActionPins.ps1
      - name: Verify exact-tag production signing boundary
        shell: pwsh
        run: ./scripts/Test-ReleaseSigningBoundary.ps1
      - name: Verify VERSION and every published product surface
        shell: pwsh
        run: >-
          ./scripts/Test-VersionConsistency.ps1
          -RequirePrerelease
      - name: Install the pinned Pester 3.4 test runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $available = @(Get-Module -ListAvailable -Name Pester |
            Where-Object { $_.Version -eq [version]'3.4.0' })
          if ($available.Count -eq 0) {
            Install-Module -Name Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -AllowClobber
          }
          Import-Module Pester -RequiredVersion 3.4.0 -Force
      - name: Run GA evidence contract regression tests
        shell: powershell
        run: >-
          Import-Module Pester -RequiredVersion 3.4.0 -Force;
          Invoke-Pester
          -Script .\scripts\Test-GAReadiness.Tests.ps1
          -EnableExit
      - name: Run Issue #5 native selector guard unit tests
        shell: powershell
        run: python .\scripts\test_issue5_selector_guard.py

  msrv:
    name: Minimum supported Rust 1.88.0 (${{ matrix.graph }})
    needs: [version-identity]
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: workspace
            os: ubuntu-latest
          - graph: desktop
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - name: Assert exact MSRV toolchain
        shell: pwsh
        run: |
          $actual = (& rustc --version).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[1]
          if ($actual -cne '1.88.0') { throw "Expected rustc 1.88.0, got $actual" }
      - name: Assert declared MSRV covers both locked dependency graphs
        shell: pwsh
        run: ./scripts/Test-RustMsrv.ps1
      - name: Check the locked workspace at MSRV
        if: matrix.graph == 'workspace'
        run: cargo check --workspace --locked
      - name: Check the locked Windows desktop host at MSRV
        if: matrix.graph == 'desktop'
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  rust:
    name: Rust (${{ matrix.os }})
    needs: [version-identity]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Worker process-lifecycle fixtures intentionally touch process-global
      # state, so run native tests on one test thread for deterministic CI.
      - run: cargo test --workspace --locked -- --test-threads=1

  native-worker-kits:
    name: Native Worker Kit (${{ matrix.label }})
    needs: [version-identity]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            platform: linux
            target: linux-x86_64
          - label: macos-x64
            os: macos-15-intel
            platform: macos
            target: macos-x86_64
          - label: macos-arm64
            os: macos-15
            platform: macos
            target: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Provision OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Build native worker
        shell: bash
        run: cargo build --locked --release -p cyc-worker
      - name: Create ephemeral native-kit publisher key
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/cyc-native-kit-${{ matrix.label }}.pem"
          der="$RUNNER_TEMP/cyc-native-kit-${{ matrix.label }}.der"
          raw="$RUNNER_TEMP/cyc-native-kit-${{ matrix.label }}.pub"
          openssl genpkey -algorithm ED25519 -out "$key"
          openssl pkey -in "$key" -pubout -outform DER -out "$der"
          python3 - "$der" "$raw" <<'PY'
          import base64
          import pathlib
          import sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          prefix = bytes.fromhex('302a300506032b6570032100')
          if len(data) != 44 or data[:12] != prefix:
              raise SystemExit('unexpected Ed25519 SPKI fixture')
          pathlib.Path(sys.argv[2]).write_text(base64.b64encode(data[12:]).decode('ascii') + '\n', encoding='ascii')
          PY
          chmod 600 "$key" "$raw"
          {
            echo "CYC_NATIVE_SIGNING_KEY=$key"
            echo "CYC_NATIVE_PUBLIC_KEY=$raw"
          } >> "$GITHUB_ENV"
      - name: Build signed native Worker Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION is empty.' }
          $kit = Join-Path $env:RUNNER_TEMP 'cyc-native-worker-kit-${{ matrix.label }}'
          New-Item -ItemType Directory -Path $kit -Force | Out-Null
          & ./packaging/worker-kits/New-WorkerKit.ps1 `
            -Target '${{ matrix.target }}' `
            -WorkerExecutable (Join-Path $PWD 'target/release/cyc-worker') `
            -OutputDirectory $kit `
            -Version $version `
            -SigningKeyPath $env:CYC_NATIVE_SIGNING_KEY `
            -SigningKeyId 'cyc-ci-native-${{ matrix.label }}' `
            -TrustedPublicKeyPath $env:CYC_NATIVE_PUBLIC_KEY | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Native worker-kit generation failed.' }
          & chmod u+x (Join-Path $kit 'cyc-worker') (Join-Path $kit 'install-worker.sh')
          if ($LASTEXITCODE -ne 0) { throw 'Worker-kit executable-bit setup failed.' }
          "CYC_NATIVE_KIT_ROOT=$kit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate native Worker Kit without mutating services
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          bash scripts/Test-WorkerKitsNative.sh \
            --platform '${{ matrix.platform }}' \
            --kit-root "$CYC_NATIVE_KIT_ROOT" \
            --public-key "$CYC_NATIVE_PUBLIC_KEY" \
            --expected-key-id 'cyc-ci-native-${{ matrix.label }}' \
            --expected-version "$version" \
            --skip-live

  web:
    name: Desktop, Windows host, and Codex bridge
    needs: [version-identity]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm --filter @clusteryourcodex/desktop native:check
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --test-threads=1
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Validate Windows install lifecycle
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .\packaging\windows\Test-WindowsPackaging.ps1
      - name: Validate managed worker kits
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File .\packaging\worker-kits\Test-WorkerKits.ps1
