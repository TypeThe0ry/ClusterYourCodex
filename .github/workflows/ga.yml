name: Protected stable GA readiness

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact stable vX.Y.Z tag to verify
        required: true
        type: string
      evidence_url:
        description: HTTPS URL of the externally captured GA evidence manifest
        required: true
        type: string
      evidence_sha256:
        description: SHA-256 digest of the external GA evidence manifest
        required: true
        type: string
      stable_assets_url:
        description: HTTPS URL of the externally built stable asset bundle (.zip)
        required: true
        type: string
      stable_assets_sha256:
        description: SHA-256 digest of the externally built stable asset bundle
        required: true
        type: string
      attestation_signer_repo:
        description: Owner/repository of the external stable payload builder
        required: true
        type: string
      attestation_signer_workflow:
        description: Full owner/repository/.github/workflows/file.yml path of the stable builder
        required: true
        type: string
      attestation_cert_identity:
        description: Exact Sigstore certificate identity for the stable builder at the source tag
        required: true
        type: string
      attestation_signer_digest:
        description: Exact 40-character workflow digest for the external stable builder
        required: true
        type: string

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  ga-readiness:
    name: Verify stable GA evidence (external hosts required)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues: read
      actions: read
      checks: read
    env:
      CYC_GA_SOURCE_TAG: ${{ inputs.source_tag }}
      CYC_GA_EVIDENCE_URL: ${{ inputs.evidence_url }}
      CYC_GA_EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
      GH_TOKEN: ${{ github.token }}
      # The branch-protection REST endpoint requires Administration:read,
      # which is unavailable to GITHUB_TOKEN. If configured, this token is
      # used only for that endpoint; an absent token intentionally fails closed.
      CYC_GA_GOVERNANCE_TOKEN: ${{ secrets.CYC_GA_GOVERNANCE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0

      - name: Verify exact stable tag and reviewed source commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CYC_GA_SOURCE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "source_tag must be a stable vX.Y.Z tag" >&2
            exit 1
          fi
          # actions/checkout first fetches the annotated tag, then force-updates
          # refs/tags/<tag> to the checked-out commit for detached HEAD. Verify
          # the immutable remote tag through a separate local namespace instead
          # of inspecting that temporary checkout ref.
          verification_ref="refs/verify/tags/$CYC_GA_SOURCE_TAG"
          git update-ref -d "$verification_ref" || true
          git fetch --no-tags --force origin "refs/tags/$CYC_GA_SOURCE_TAG:$verification_ref"
          if [[ "$(git cat-file -t "$verification_ref")" != 'tag' ]]; then
            echo "source_tag must resolve to an annotated tag" >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          tag_object="$(git rev-parse "$verification_ref")"
          tag_commit="$(git rev-parse "$verification_ref^{commit}")"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "source tag does not resolve to the checked-out commit" >&2
            exit 1
          fi
          echo "CYC_GA_SOURCE_COMMIT=$head_commit" >> "$GITHUB_ENV"
          echo "CYC_GA_SOURCE_TAG_OBJECT=$tag_object" >> "$GITHUB_ENV"
          {
            echo "## Stable GA source"
            echo
            echo "- tag: `$CYC_GA_SOURCE_TAG`"
            echo "- commit: `$head_commit`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every remote GitHub Action is commit-pinned
        shell: pwsh
        run: ./scripts/Test-GitHubActionPins.ps1

      - name: Verify stable product version identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = (& ./scripts/Test-VersionConsistency.ps1 `
            -SourceTag $env:CYC_GA_SOURCE_TAG `
            -SkipNegativeTests `
            -Json) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Stable version consistency gate failed with exit code $LASTEXITCODE."
          }
          if ([string]$result.releaseChannel -cne 'stable' -or
              [string]$result.productVersion -cne $env:CYC_GA_SOURCE_TAG.Substring(1)) {
            throw "Stable version identity is inconsistent with $env:CYC_GA_SOURCE_TAG."
          }

      - name: Verify exact-source CI run and required checks
        shell: bash
        run: |
          set -euo pipefail
          ci_dir="$RUNNER_TEMP/cyc-ga-readiness"
          mkdir -p "$ci_dir"
          [[ "$CYC_GA_SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          ci_run_api="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$CYC_GA_SOURCE_COMMIT&per_page=100"
          ci_run_url="https://api.github.com/$ci_run_api"
          if ! gh api --paginate --slurp "$ci_run_api" > "$ci_dir/ci-run-pages.json"; then
            echo 'failed to snapshot the exact-source CI workflow runs' >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "object" and (.workflow_runs | type == "array") and (.total_count | type == "number"))' "$ci_dir/ci-run-pages.json" >/dev/null; then
            echo 'CI workflow-run pagination returned an incomplete page envelope' >&2
            exit 1
          fi
          selected_run_id="$(jq -r --arg sha "$CYC_GA_SOURCE_COMMIT" '
            [ .[] | .workflow_runs[]
              | select(.name == "CI" and .path == ".github/workflows/ci.yml"
                       and .head_branch == "main" and .event == "push"
                       and ((.head_sha | ascii_downcase) == ($sha | ascii_downcase)))
            ]
            | sort_by(.run_number, .run_attempt, .updated_at, .id)
            | if length == 0 then empty else .[-1].id end
          ' "$ci_dir/ci-run-pages.json")"
          [[ "$selected_run_id" =~ ^[1-9][0-9]*$ ]]
          ci_jobs_api="repos/$GITHUB_REPOSITORY/actions/runs/$selected_run_id/jobs?per_page=100"
          ci_jobs_url="https://api.github.com/$ci_jobs_api"
          if ! gh api --paginate --slurp "$ci_jobs_api" > "$ci_dir/ci-job-pages.json"; then
            echo 'failed to snapshot the exact-source CI jobs' >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "object" and (.jobs | type == "array") and (.total_count | type == "number"))' "$ci_dir/ci-job-pages.json" >/dev/null; then
            echo 'CI job pagination returned an incomplete page envelope' >&2
            exit 1
          fi
          ci_checks_api="repos/$GITHUB_REPOSITORY/commits/$CYC_GA_SOURCE_COMMIT/check-runs?per_page=100"
          ci_checks_url="https://api.github.com/$ci_checks_api"
          if ! gh api --paginate --slurp "$ci_checks_api" > "$ci_dir/ci-check-run-pages.json"; then
            echo 'failed to snapshot the exact-source CI check runs' >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "object" and (.check_runs | type == "array") and (.total_count | type == "number"))' "$ci_dir/ci-check-run-pages.json" >/dev/null; then
            echo 'CI check-run pagination returned an incomplete page envelope' >&2
            exit 1
          fi
          set +e
          ci_proof="$(pwsh -NoLogo -NoProfile -NonInteractive -File ./scripts/Test-GARequiredChecks.ps1 \
            -Repository "$GITHUB_REPOSITORY" \
            -ExpectedCommit "$CYC_GA_SOURCE_COMMIT" \
            -Workflow ci.yml \
            -WorkflowName CI \
            -WorkflowPath .github/workflows/ci.yml \
            -Branch main \
            -Event push \
            -RunListPath "$ci_dir/ci-run-pages.json" \
            -JobsPath "$ci_dir/ci-job-pages.json" \
            -CheckRunsPath "$ci_dir/ci-check-run-pages.json" \
            -Json 2>&1)"
          ci_proof_status=$?
          set -e
          printf '%s\n' "$ci_proof" > "$ci_dir/ci-required-checks.json"
          if (( ci_proof_status != 0 )); then
            cat "$ci_dir/ci-required-checks.json" >&2
            exit "$ci_proof_status"
          fi
          jq -e --arg sha "$CYC_GA_SOURCE_COMMIT" \
            'type == "object" and .status == "passed" and (.sourceCommit | ascii_downcase) == ($sha | ascii_downcase)' \
            "$ci_dir/ci-required-checks.json" >/dev/null
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          proof_sha256="$(sha256sum "$ci_dir/ci-required-checks.json" | awk '{print tolower($1)}')"
          jq -S -n \
            --arg schemaVersion 'cyc.dev/ga-ci-runs/v1' \
            --arg commit "$CYC_GA_SOURCE_COMMIT" \
            --arg capturedAt "$captured_at" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runEndpoint "$ci_run_url" \
            --arg jobsEndpoint "$ci_jobs_url" \
            --arg checkRunsEndpoint "$ci_checks_url" \
            --arg proofSha256 "$proof_sha256" \
            --argjson runId "$selected_run_id" \
            --slurpfile proof "$ci_dir/ci-required-checks.json" \
            '{schemaVersion: $schemaVersion, sourceCommit: $commit, capturedAt: $capturedAt,
              repository: $repository,
              workflow: {name: "CI", path: ".github/workflows/ci.yml", branch: "main", event: "push", runId: $runId},
              api: {provider: "github-rest-api", complete: true, incomplete: false, hasNextPage: false,
                    runEndpoint: $runEndpoint, jobsEndpoint: $jobsEndpoint, checkRunsEndpoint: $checkRunsEndpoint},
              proofSha256: $proofSha256, proof: $proof[0]}' \
            > "$ci_dir/ci-snapshot.json"
          jq -e --arg sha "$CYC_GA_SOURCE_COMMIT" \
            'type == "object" and .schemaVersion == "cyc.dev/ga-ci-runs/v1" and
             (.sourceCommit | ascii_downcase) == ($sha | ascii_downcase) and
             .api.provider == "github-rest-api" and .api.complete == true and
             .api.incomplete == false and .api.hasNextPage == false and
             .proof.status == "passed"' \
            "$ci_dir/ci-snapshot.json" >/dev/null
          ci_snapshot_sha256="$(sha256sum "$ci_dir/ci-snapshot.json" | awk '{print tolower($1)}')"
          printf 'CYC_GA_CI_SNAPSHOT_PATH=%s\n' "$ci_dir/ci-snapshot.json" >> "$GITHUB_ENV"
          printf 'CYC_GA_CI_SNAPSHOT_SHA256=%s\n' "$ci_snapshot_sha256" >> "$GITHUB_ENV"
          printf 'CYC_GA_CI_PROOF_PATH=%s\n' "$ci_dir/ci-required-checks.json" >> "$GITHUB_ENV"
          {
            echo "Exact-source CI proof: run $selected_run_id, commit $CYC_GA_SOURCE_COMMIT"
            echo "Required checks: $(jq -r '.counts.passed' "$ci_dir/ci-required-checks.json")"
            echo "CI snapshot SHA-256: $ci_snapshot_sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and hash externally captured GA evidence
        shell: bash
        run: |
          set -euo pipefail
          case "$CYC_GA_EVIDENCE_URL" in
            https://*) ;;
            *) echo "evidence_url must use HTTPS" >&2; exit 1 ;;
          esac
          python3 ./scripts/Test-ExternalHttpsUrl.py "$CYC_GA_EVIDENCE_URL"
          if [[ ! "$CYC_GA_EVIDENCE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "evidence_sha256 must be a 64-character SHA-256 digest" >&2
            exit 1
          fi
          evidence_path="$RUNNER_TEMP/cyc-ga-evidence.json"
          curl --fail --location --max-redirs 0 --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 2 --connect-timeout 20 --max-time 300 \
            --max-filesize 67108864 --output "$evidence_path" "$CYC_GA_EVIDENCE_URL"
          if [[ "$(stat -c '%s' "$evidence_path")" -gt 67108864 ]]; then
            echo 'external GA evidence exceeds the 64 MiB size limit' >&2
            exit 1
          fi
          actual_hash="$(sha256sum "$evidence_path" | awk '{print tolower($1)}')"
          expected_hash="$(printf '%s' "$CYC_GA_EVIDENCE_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_hash" != "$expected_hash" ]]; then
            echo "external GA evidence SHA-256 does not match evidence_sha256" >&2
            exit 1
          fi
          echo "CYC_GA_EVIDENCE_PATH=$evidence_path" >> "$GITHUB_ENV"

      - name: Download and verify each retained GA raw log
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $readinessDirectory = Join-Path $env:RUNNER_TEMP 'cyc-ga-readiness'
          $outputDirectory = Join-Path $readinessDirectory 'raw-logs'
          & ./scripts/Test-GARawLogs.ps1 `
            -EvidencePath $env:CYC_GA_EVIDENCE_PATH `
            -OutputDirectory $outputDirectory `
            -ExpectedCommit $env:CYC_GA_SOURCE_COMMIT | Out-Host
          $verificationPath = Join-Path $outputDirectory 'raw-log-verification.json'
          if (-not (Test-Path -LiteralPath $verificationPath -PathType Leaf)) {
            throw "Raw-log verification report was not written: $verificationPath"
          }
          "CYC_GA_RAW_LOG_VERIFICATION_PATH=$verificationPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Snapshot live issue gates and repository governance
        shell: bash
        run: |
          set -euo pipefail
          gate_dir="$RUNNER_TEMP/cyc-ga-readiness"
          mkdir -p "$gate_dir"
          gh_governance_api() {
            if [[ -n "${CYC_GA_GOVERNANCE_TOKEN:-}" ]]; then
              GH_TOKEN="$CYC_GA_GOVERNANCE_TOKEN" gh api "$@"
            else
              gh api "$@"
            fi
          }
          for number in 2 3 5; do
            if gh api "repos/$GITHUB_REPOSITORY/issues/$number" > "$gate_dir/issue-$number.json"; then
              :
            else
              printf '{"number":%s,"state":"api-error"}\n' "$number" > "$gate_dir/issue-$number.json"
            fi
          done
          jq -n \
            --slurpfile issue2 "$gate_dir/issue-2.json" \
            --slurpfile issue3 "$gate_dir/issue-3.json" \
            --slurpfile issue5 "$gate_dir/issue-5.json" \
            '{issues: [$issue2[0], $issue3[0], $issue5[0]]}' \
            > "$gate_dir/issues.json"

          # Re-query the complete open-issue collection instead of relying on
          # the externally captured blocker inventory. Pull requests are
          # intentionally excluded because the inventory contract describes
          # repository issues, not review check-runs.
          open_issue_endpoint="https://api.github.com/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100"
          if ! gh api --paginate --slurp "$open_issue_endpoint" > "$gate_dir/open-issue-pages.json"; then
            echo 'failed to snapshot the complete open-issue collection' >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and all(.[]; type == "array")' "$gate_dir/open-issue-pages.json" >/dev/null; then
            echo 'open-issue API pagination returned an incomplete page envelope' >&2
            exit 1
          fi
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -S -n \
            --arg commit "$CYC_GA_SOURCE_COMMIT" \
            --arg capturedAt "$captured_at" \
            --arg endpoint "$open_issue_endpoint" \
            --slurpfile pages "$gate_dir/open-issue-pages.json" \
            '
              ($pages[0]) as $pageArrays
              | [ $pageArrays[] | .[]
                  | select((has("pull_request") | not))
                  | {number, state, title, html_url, labels: [ .labels[]? | {name} ]}
                ] as $issues
              | {schemaVersion: "cyc.dev/ga-open-issue-snapshot/v1",
                 sourceCommit: $commit,
                 capturedAt: $capturedAt,
                 api: {provider: "github-rest-api", endpoint: $endpoint,
                       requestedState: "open", complete: true, incomplete: false,
                       hasNextPage: false, pageCount: ($pageArrays | length),
                       totalCount: ($issues | length), returnedCount: ($issues | length),
                       capturedAt: $capturedAt, sourceCommit: $commit, error: null},
                 issues: $issues}
            ' > "$gate_dir/open-issues.json"

          if gh api "repos/$GITHUB_REPOSITORY" > "$gate_dir/repository.json"; then
            :
          else
            printf '{"default_branch":"","apiError":true}\n' > "$gate_dir/repository.json"
          fi
          default_branch="$(jq -r '.default_branch // empty' "$gate_dir/repository.json")"
          if [[ -z "$default_branch" ]]; then
            echo 'repository metadata did not provide a default branch' >&2
            exit 1
          fi
          encoded_branch="$(jq -rn --arg branch "$default_branch" '$branch | @uri')"
          # The branch endpoint exposes both the authoritative `protected`
          # flag and `protection.enabled`. The separate protection endpoint
          # supplies the force-push/deletion/admin-enforcement controls.
          if gh api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch" > "$gate_dir/branch.json"; then
            :
          else
            printf '{"name":"","protected":false,"protection":{"enabled":false},"apiError":true}\n' > "$gate_dir/branch.json"
          fi
          if gh_governance_api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch/protection" > "$gate_dir/branch-protection.json"; then
            :
          else
            printf '{"allow_force_pushes":{"enabled":true},"allow_deletions":{"enabled":true},"enforce_admins":{"enabled":false},"apiError":true}\n' > "$gate_dir/branch-protection.json"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$gate_dir/production-environment.json"; then
            :
          else
            printf '{"name":"production","can_admins_bypass":true,"protection_rules":[],"apiError":true}\n' > "$gate_dir/production-environment.json"
          fi
          # Test-GAReadiness requires a non-empty required_reviewers list and
          # `prevent_self_review=true`; a missing or malformed snapshot fails closed.
          if gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" > "$gate_dir/deployment-policies.json"; then
            :
          else
            printf '{"branch_policies":[],"apiError":true}\n' > "$gate_dir/deployment-policies.json"
          fi
          jq -n \
            --arg defaultBranch "$default_branch" \
            --slurpfile branch "$gate_dir/branch.json" \
            --slurpfile branchProtection "$gate_dir/branch-protection.json" \
            --slurpfile environment "$gate_dir/production-environment.json" \
            --slurpfile policies "$gate_dir/deployment-policies.json" \
            '{defaultBranch: $defaultBranch, branchProtection: ($branch[0] + {protectionDetails: $branchProtection[0]}), productionEnvironment: $environment[0], deploymentBranchPolicies: $policies[0]}' \
            > "$gate_dir/controls.json"
          echo "CYC_GA_ISSUE_SNAPSHOT_PATH=$gate_dir/issues.json" >> "$GITHUB_ENV"
          echo "CYC_GA_LIVE_BLOCKER_SNAPSHOT_PATH=$gate_dir/open-issues.json" >> "$GITHUB_ENV"
          echo "CYC_GA_CONTROLS_PATH=$gate_dir/controls.json" >> "$GITHUB_ENV"
          echo "CYC_GA_REPORT_DIR=$gate_dir" >> "$GITHUB_ENV"

      - name: Verify GA evidence, issue closure, and governance controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:CYC_GA_REPORT_DIR 'ga-readiness.json'
          try {
            $resultLines = @(& ./scripts/Test-GAReadiness.ps1 `
              -RepositoryRoot $PWD `
              -ExpectedTag $env:CYC_GA_SOURCE_TAG `
              -ExpectedCommit $env:CYC_GA_SOURCE_COMMIT `
              -EvidencePath $env:CYC_GA_EVIDENCE_PATH `
              -RawLogVerificationPath $env:CYC_GA_RAW_LOG_VERIFICATION_PATH `
              -IssueSnapshotPath $env:CYC_GA_ISSUE_SNAPSHOT_PATH `
              -LiveBlockerSnapshotPath $env:CYC_GA_LIVE_BLOCKER_SNAPSHOT_PATH `
              -ControlsPath $env:CYC_GA_CONTROLS_PATH `
              -Json)
            $readinessExitCode = $LASTEXITCODE
            if ($readinessExitCode -ne 0) {
              throw "GA readiness gate process exited with code $readinessExitCode."
            }
            if ($resultLines.Count -eq 0) {
              throw 'GA readiness gate produced no JSON result.'
            }
            $resultJson = $resultLines -join "`n"
            $result = $resultJson | ConvertFrom-Json
            if ([string]$result.status -cne 'passed') {
              throw "GA readiness gate returned unexpected status '$($result.status)'."
            }
            $resultJson | Set-Content -LiteralPath $reportPath -Encoding UTF8
            $resultJson | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          } catch {
            [string]$_.Exception.Message | Set-Content -LiteralPath $reportPath -Encoding UTF8
            throw
          }

      - name: Upload GA gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClusterYourCodex-ga-readiness-${{ inputs.source_tag }}
          path: ${{ runner.temp }}/cyc-ga-readiness/*
          if-no-files-found: warn
          retention-days: 30

  stable-publisher:
    name: Publish verified stable release
    if: needs.ga-readiness.result == 'success'
    needs: [ga-readiness]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      issues: read
      attestations: read
      actions: read
      checks: read
    env:
      CYC_GA_SOURCE_TAG: ${{ inputs.source_tag }}
      CYC_GA_EVIDENCE_URL: ${{ inputs.evidence_url }}
      CYC_GA_EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
      CYC_STABLE_ASSET_URL: ${{ inputs.stable_assets_url }}
      CYC_STABLE_ASSET_SHA256: ${{ inputs.stable_assets_sha256 }}
      CYC_GA_ATTESTATION_SIGNER_REPO: ${{ inputs.attestation_signer_repo }}
      CYC_GA_ATTESTATION_SIGNER_WORKFLOW: ${{ inputs.attestation_signer_workflow }}
      CYC_GA_ATTESTATION_CERT_IDENTITY: ${{ inputs.attestation_cert_identity }}
      CYC_GA_ATTESTATION_SIGNER_DIGEST: ${{ inputs.attestation_signer_digest }}
      # These values are protected production-environment policy, not
      # operator-controlled dispatch inputs. The request must match the
      # reviewed stable builder exactly.
      CYC_GA_TRUSTED_BUILDER_REPO: ${{ secrets.CYC_GA_TRUSTED_BUILDER_REPO }}
      CYC_GA_TRUSTED_BUILDER_WORKFLOW: ${{ secrets.CYC_GA_TRUSTED_BUILDER_WORKFLOW }}
      CYC_GA_TRUSTED_BUILDER_DIGEST: ${{ secrets.CYC_GA_TRUSTED_BUILDER_DIGEST }}
      # The branch-protection REST endpoint requires Administration:read;
      # this optional token is scoped to governance probes only.
      CYC_GA_GOVERNANCE_TOKEN: ${{ secrets.CYC_GA_GOVERNANCE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0

      - name: Verify exact stable source tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CYC_GA_SOURCE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "source_tag must be a stable vX.Y.Z tag" >&2
            exit 1
          fi
          # actions/checkout may rewrite refs/tags/<tag> to the detached
          # commit. Resolve the remote annotated tag through an isolated ref.
          verification_ref="refs/verify/tags/$CYC_GA_SOURCE_TAG"
          git update-ref -d "$verification_ref" || true
          git fetch --no-tags --force origin "refs/tags/$CYC_GA_SOURCE_TAG:$verification_ref"
          if [[ "$(git cat-file -t "$verification_ref")" != 'tag' ]]; then
            echo "source_tag must resolve to an annotated tag" >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          tag_object="$(git rev-parse "$verification_ref")"
          tag_commit="$(git rev-parse "$verification_ref^{commit}")"
          test "$head_commit" = "$tag_commit"
          printf 'CYC_GA_SOURCE_COMMIT=%s\n' "$head_commit" >> "$GITHUB_ENV"
          printf 'CYC_GA_SOURCE_TAG_OBJECT=%s\n' "$tag_object" >> "$GITHUB_ENV"

      - name: Download and verify externally built stable asset bundle
        shell: bash
        run: |
          set -euo pipefail
          case "$CYC_STABLE_ASSET_URL" in
            https://*) ;;
            *) echo "stable_assets_url must use HTTPS" >&2; exit 1 ;;
          esac
          python3 ./scripts/Test-ExternalHttpsUrl.py "$CYC_STABLE_ASSET_URL"
          if [[ ! "$CYC_STABLE_ASSET_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "stable_assets_sha256 must be a 64-character SHA-256 digest" >&2
            exit 1
          fi
          max_bundle_bytes=2147483648
          max_zip_entries=512
          max_entry_uncompressed_bytes=2147483648
          max_total_uncompressed_bytes=8589934592
          bundle="$RUNNER_TEMP/clusteryourcodex-stable-assets.zip"
          curl --fail --location --max-redirs 0 --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 2 --connect-timeout 20 --max-time 300 \
            --max-filesize "$max_bundle_bytes" --output "$bundle" "$CYC_STABLE_ASSET_URL"
          actual_hash="$(sha256sum "$bundle" | awk '{print tolower($1)}')"
          expected_hash="$(printf '%s' "$CYC_STABLE_ASSET_SHA256" | tr '[:upper:]' '[:lower:]')"
          test "$actual_hash" = "$expected_hash"
          # Validate ZIP names and file types before extraction. The stable
          # bundle is externally supplied, so reject traversal, absolute
          # paths, symlinks, and special files before unzip can touch the
          # runner filesystem.
          python3 - "$bundle" "$max_bundle_bytes" "$max_zip_entries" \
            "$max_entry_uncompressed_bytes" "$max_total_uncompressed_bytes" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          max_bundle_bytes = int(sys.argv[2])
          max_zip_entries = int(sys.argv[3])
          max_entry_uncompressed_bytes = int(sys.argv[4])
          max_total_uncompressed_bytes = int(sys.argv[5])
          if archive.stat().st_size > max_bundle_bytes:
              raise SystemExit('stable asset bundle exceeds the compressed-size budget')
          with zipfile.ZipFile(archive) as handle:
              entries = handle.infolist()
              if not entries:
                  raise SystemExit('stable asset bundle ZIP is empty')
              if len(entries) > max_zip_entries:
                  raise SystemExit('stable asset bundle exceeds the ZIP entry budget')
              total_uncompressed = 0
              seen_names = set()
              for entry in entries:
                  name = entry.filename.replace('\\', '/')
                  # Normalize only the separator representation. Empty and
                  # current-directory components are rejected instead of
                  # silently collapsing them, so the duplicate key matches
                  # the path that a downstream extractor will materialize.
                  path_name = name[:-1] if name.endswith('/') else name
                  parts = path_name.split('/') if path_name else []
                  lowered_parts = [part.casefold() for part in parts]
                  namespace_parts = {'globalroot', 'device'}
                  if (not parts or any(part in ('', '.') for part in parts) or
                      '..' in parts or name.startswith('/') or
                      (len(name) >= 2 and name[1] == ':') or
                      any(part in namespace_parts or part.startswith('volume{') for part in lowered_parts)):
                      raise SystemExit(f'unsafe stable bundle ZIP path: {entry.filename!r}')
                  normalized = '/'.join(lowered_parts)
                  if normalized in seen_names:
                      raise SystemExit(f'duplicate stable bundle ZIP path: {entry.filename!r}')
                  seen_names.add(normalized)
                  if entry.flag_bits & 0x1:
                      raise SystemExit(f'encrypted stable bundle ZIP entry: {entry.filename!r}')
                  if entry.file_size < 0 or entry.file_size > max_entry_uncompressed_bytes:
                      raise SystemExit(f'stable bundle ZIP entry exceeds the per-entry budget: {entry.filename!r}')
                  total_uncompressed += entry.file_size
                  if total_uncompressed > max_total_uncompressed_bytes:
                      raise SystemExit('stable asset bundle exceeds the total uncompressed-size budget')
                  mode = (entry.external_attr >> 16) & 0o170000
                  if stat.S_ISLNK(mode) or (mode and not name.endswith('/') and not stat.S_ISREG(mode)):
                      raise SystemExit(f'unsafe stable bundle ZIP entry type: {entry.filename!r}')
          PY
          extract="$RUNNER_TEMP/clusteryourcodex-stable-assets"
          rm -rf "$extract"
          mkdir -p "$extract"
          unzip -q "$bundle" -d "$extract"
          if find "$extract" \( -type l -o -type b -o -type c -o -type p \) -print -quit | grep -q .; then
            echo 'stable asset bundle extraction produced a link or special file' >&2
            exit 1
          fi
          mapfile -t roots < <(find "$extract" -mindepth 1 -maxdepth 1 -type d -print | sort)
          if [[ ${#roots[@]} -eq 1 && -f "${roots[0]}/release-index.json" ]]; then
            bundle_root="${roots[0]}"
          elif [[ -f "$extract/release-index.json" ]]; then
            bundle_root="$extract"
          else
            echo 'stable asset bundle must contain one root with release-index.json' >&2
            exit 1
          fi
          printf 'CYC_STABLE_BUNDLE_ROOT=%s\n' "$bundle_root" >> "$GITHUB_ENV"

      - name: Verify stable bundle identity, sidecars, and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resultLines = @(& ./scripts/Test-StableAssetBundle.ps1 `
            -BundleRoot $env:CYC_STABLE_BUNDLE_ROOT `
            -ExpectedTag $env:CYC_GA_SOURCE_TAG `
            -ExpectedCommit $env:CYC_GA_SOURCE_COMMIT `
            -Json)
          $exitCode = $LASTEXITCODE
          $reportPath = Join-Path $env:RUNNER_TEMP 'cyc-stable-bundle-verification.json'
          $resultLines | Set-Content -LiteralPath $reportPath -Encoding UTF8
          if ($exitCode -ne 0) {
            throw "Stable asset bundle verification failed with exit code $exitCode."
          }
          $result = ($resultLines -join "`n") | ConvertFrom-Json
          if ([string]$result.status -cne 'passed') {
            throw 'Stable asset bundle verification did not return status=passed.'
          }
          "CYC_STABLE_INDEX_SHA256=$([string]$result.indexSha256)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CYC_STABLE_PROVENANCE_BUNDLE_NAME=$([string]$result.provenanceBundleName)" | Add-Content -LiteralPath $env:GITHUB_ENV
          $result | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Cross-bind GA evidence to the downloaded stable index
        shell: bash
        run: |
          set -euo pipefail
          case "$CYC_GA_EVIDENCE_URL" in
            https://*) ;;
            *) echo 'evidence_url must use HTTPS' >&2; exit 1 ;;
          esac
          python3 ./scripts/Test-ExternalHttpsUrl.py "$CYC_GA_EVIDENCE_URL"
          if [[ ! "$CYC_GA_EVIDENCE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'evidence_sha256 must be a 64-character SHA-256 digest' >&2
            exit 1
          fi
          evidence_path="$RUNNER_TEMP/cyc-ga-evidence.json"
          curl --fail --location --max-redirs 0 --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 2 --connect-timeout 20 --max-time 300 \
            --max-filesize 67108864 --output "$evidence_path" "$CYC_GA_EVIDENCE_URL"
          if [[ "$(stat -c '%s' "$evidence_path")" -gt 67108864 ]]; then
            echo 'external GA evidence exceeds the 64 MiB size limit' >&2
            exit 1
          fi
          evidence_hash="$(sha256sum "$evidence_path" | awk '{print tolower($1)}')"
          expected_evidence_hash="$(printf '%s' "$CYC_GA_EVIDENCE_SHA256" | tr '[:upper:]' '[:lower:]')"
          test "$evidence_hash" = "$expected_evidence_hash"
          raw_log_dir="$RUNNER_TEMP/cyc-stable-raw-logs"
          pwsh -NoLogo -NoProfile -File "$GITHUB_WORKSPACE/scripts/Test-GARawLogs.ps1" \
            -EvidencePath "$evidence_path" \
            -OutputDirectory "$raw_log_dir" \
            -ExpectedCommit "$CYC_GA_SOURCE_COMMIT" >/dev/null
          raw_verification="$raw_log_dir/raw-log-verification.json"
          test -f "$raw_verification"
          printf 'CYC_GA_RAW_LOG_VERIFICATION_PATH=%s\n' "$raw_verification" >> "$GITHUB_ENV"
          # Test-GARawLogs has already source-bound the retained markers. Keep
          # its gateEvidence output as the input to an independent Ubuntu-side
          # SHA-256 calculation so a syntactically valid 64-hex marker cannot
          # stand in for the digest of its normalized command.
          python3 - "$raw_verification" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from datetime import datetime, timezone

          verification_path = sys.argv[1]
          with open(verification_path, encoding="utf-8") as handle:
              verification = json.load(handle)

          records = verification.get("records")
          if not isinstance(records, list):
              raise SystemExit("Issue #5 raw-log verification records are not an array")
          issue5_records = [
              record for record in records
              if isinstance(record, dict) and record.get("issue") == "issue5"
          ]
          if len(issue5_records) != 1:
              raise SystemExit("Issue #5 raw-log verification must contain exactly one record")
          gate_evidence = issue5_records[0].get("gateEvidence")
          if not isinstance(gate_evidence, list) or len(gate_evidence) != 9:
              raise SystemExit("Issue #5 raw-log verification must retain all nine gate records")

          whitespace = re.compile(r"\s+")
          run_id_pattern = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$")
          iso_instant_pattern = re.compile(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^\s]+(Z|[+-][0-9]{2}:[0-9]{2})$")
          maximum_test_count = 1000000000
          issue5_required_prefixes = {
              "linuxDedicatedExecutionIdentity": {
                  "linux": ("uid=", "gid="),
              },
              "linuxCgroupV2Reconciliation": {
                  "linux": ("cgroup_escape=blocked", "cgroup.threads_escape=blocked"),
              },
              "windowsIsolatedExecutionIdentity": {
                  "windows": ("windowsExecutionIdentityVerified=1",),
              },
              "windowsJobObject": {
                  "windows": ("windowsJobObjectVerified=1",),
              },
              "windowsProtectedExternalGuard": {
                  "windows": ("windowsProtectedExternalGuardVerified=1",),
              },
              "macosExternalReconciliation": {
                  "macos": ("macosExternalReconciliationVerified=1",),
              },
              "jobsCannotAlterGuardState": {
                  "linux": ("linuxGuardTamperRejected=1",),
                  "windows": ("windowsGuardTamperRejected=1",),
                  "macos": ("macosGuardTamperRejected=1",),
              },
              "jobsCannotReadWorkerCredentials": {
                  "linux": ("linuxWorkerCredentialIsolationVerified=1",),
                  "windows": ("windowsWorkerCredentialIsolationVerified=1",),
                  "macos": ("macosWorkerCredentialIsolationVerified=1",),
              },
              "restartResidualProcessReconciliation": {
                  "linux": ("residual_empty", "residualCgroupVerified=1", "residualIdentityProcessesVerified=1"),
                  "windows": ("residualJobObjectVerified=1",),
                  "macos": ("residualExternalReconciliationVerified=1",),
              },
          }
          def issue5_marker_matches(marker, contract):
              # uid/gid carry a runtime-selected dedicated identity.  Every
              # other native marker is a fixed contract value and must match
              # the complete string, not just its prefix.
              if contract == "uid=":
                  return re.fullmatch(r"uid=[0-9]+", marker) is not None
              if contract == "gid=":
                  return re.fullmatch(r"gid=[0-9]+", marker) is not None
              return marker == contract
          seen_gates = set()
          seen_run_platform = {}
          binding_count = 0

          def normalized_command(value, description):
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"{description}.command is not a non-empty string")
              return whitespace.sub(" ", value.strip())

          def parse_iso_instant(value, description):
              if not isinstance(value, str) or not iso_instant_pattern.fullmatch(value):
                  raise SystemExit(f"{description} is not an ISO-8601 instant")
              try:
                  instant = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError as exc:
                  raise SystemExit(f"{description} is not parseable ISO-8601") from exc
              if instant.tzinfo is None or instant.utcoffset() is None:
                  raise SystemExit(f"{description} does not carry an explicit timezone")
              return instant.astimezone(timezone.utc)

          def resolve_alias(run, canonical, alias, description):
              has_canonical = canonical in run
              has_alias = alias in run
              if has_canonical and has_alias:
                  if type(run[canonical]) is not type(run[alias]) or run[canonical] != run[alias]:
                      raise SystemExit(
                          f"{description}.{canonical} and {alias} aliases must match exactly"
                      )
                  return run[canonical]
              if has_canonical:
                  return run[canonical]
              if has_alias:
                  return run[alias]
              raise SystemExit(f"{description} is missing canonical {canonical} (or compatibility alias {alias})")

          def validate_run_provenance(run, description):
              if not isinstance(run, dict):
                  raise SystemExit(f"{description} is not an object")
              required = ("runId", "node", "provider", "hostType", "status", "exitCode", "tests", "startedAt", "endedAt")
              missing = [field for field in required if field not in run]
              if missing:
                  raise SystemExit(f"{description} is missing provenance fields: {', '.join(missing)}")
              for field in ("runId", "node"):
                  value = run[field]
                  if type(value) is not str or not run_id_pattern.fullmatch(value):
                      raise SystemExit(f"{description}.{field} is not a bounded string identifier")
              if re.search(r"github|actions|hosted|runner", run["node"], re.IGNORECASE):
                  raise SystemExit(f"{description}.node identifies a hosted execution surface")
              for field in ("provider", "hostType"):
                  value = run[field]
                  if type(value) is not str or not value.strip():
                      raise SystemExit(f"{description}.{field} is not a non-empty string")
                  if re.search(r"github|actions|hosted|runner", value, re.IGNORECASE):
                      raise SystemExit(f"{description}.{field} identifies a hosted execution surface")
              if not (run["status"] == "passed" or run["status"] is True):
                  raise SystemExit(f"{description}.status is not passed")
              if type(run["exitCode"]) is not int or run["exitCode"] != 0:
                  raise SystemExit(f"{description}.exitCode is not integer zero")
              tests = run["tests"]
              if not isinstance(tests, dict):
                  raise SystemExit(f"{description}.tests is not an object")
              for field in ("passed", "failed", "ignored"):
                  value = tests.get(field)
                  if type(value) is not int or value < 0 or value > maximum_test_count:
                      raise SystemExit(
                          f"{description}.tests.{field} is not an integer in the range 0..{maximum_test_count}"
                      )
              if tests["passed"] <= 0 or tests["failed"] != 0:
                  raise SystemExit(f"{description}.tests does not describe a successful run")
              started_at = parse_iso_instant(run["startedAt"], f"{description}.startedAt")
              ended_at = parse_iso_instant(run["endedAt"], f"{description}.endedAt")
              if ended_at < started_at:
                  raise SystemExit(f"{description}.endedAt precedes startedAt")
              return run["runId"]

          for gate in gate_evidence:
              if not isinstance(gate, dict):
                  raise SystemExit("Issue #5 gateEvidence entry is not an object")
              gate_name = gate.get("gate")
              if not isinstance(gate_name, str) or not gate_name:
                  raise SystemExit("Issue #5 gateEvidence entry has no gate name")
              if gate_name in seen_gates:
                  raise SystemExit(f"Issue #5 gateEvidence repeats gate {gate_name}")
              seen_gates.add(gate_name)

              raw_runs = gate.get("runs")
              is_matrix = raw_runs is not None
              if raw_runs is None:
                  runs = [gate]
              elif not isinstance(raw_runs, list) or len(raw_runs) != 3:
                  raise SystemExit(f"Issue #5 matrix gate {gate_name} does not retain three runs")
              else:
                  runs = raw_runs
              matrix_run_ids = set()
              matrix_platforms = set()

              for run in runs:
                  if not isinstance(run, dict):
                      raise SystemExit(f"Issue #5 gate {gate_name} run is not an object")
                  run_id = validate_run_provenance(run, f"Issue #5 gate {gate_name} run")
                  platform = run.get("platform")
                  selector = resolve_alias(run, "testSelector", "selector", f"Issue #5 gate {gate_name} run")
                  command = run.get("command")
                  markers = resolve_alias(run, "rawLogMarkers", "markers", f"Issue #5 gate {gate_name} run")
                  description = f"Issue #5 gate {gate_name}"
                  if not isinstance(platform, str) or not platform:
                      raise SystemExit(f"{description}.platform is not a non-empty string")
                  platform = platform.lower()
                  if platform not in {"linux", "windows", "macos"}:
                      raise SystemExit(f"{description}.platform is not linux, windows, or macos")
                  if is_matrix:
                      if platform in matrix_platforms:
                          raise SystemExit(f"{description}.platform is repeated within the matrix")
                      matrix_platforms.add(platform)
                      if run_id in matrix_run_ids:
                          raise SystemExit(f"{description}.runId is repeated within the matrix")
                      matrix_run_ids.add(run_id)
                  previous_platform = seen_run_platform.get(run_id)
                  if previous_platform is not None and previous_platform != platform:
                      raise SystemExit(
                          f"{description}.runId {run_id!r} is bound to both {previous_platform} and {platform}"
                      )
                  seen_run_platform[run_id] = platform
                  if not isinstance(selector, str) or not selector:
                      raise SystemExit(f"{description}.selector is not a non-empty string")
                  if (not isinstance(markers, list)
                          or any(type(marker) is not str or not marker.strip() for marker in markers)
                          or len(set(markers)) != len(markers)):
                      raise SystemExit(f"{description}.markers is not an array of strings")
                  required_prefixes = issue5_required_prefixes.get(gate_name, {}).get(platform, ())
                  if gate_name == "restartResidualProcessReconciliation":
                      if not any(any(issue5_marker_matches(marker, prefix) for marker in markers)
                                 for prefix in required_prefixes):
                          raise SystemExit(f"{description}.markers is missing the native residual marker for {platform}")
                  elif not all(any(issue5_marker_matches(marker, prefix) for marker in markers)
                               for prefix in required_prefixes):
                      raise SystemExit(f"{description}.markers is missing a required native marker for {platform}")
                  normalized = normalized_command(command, description)
                  digest = hashlib.sha256(normalized.encode("utf-8")).hexdigest()
                  expected_marker = (
                      f"CYC-GA-ISSUE5|platform={platform.lower()}|selector={selector}"
                      f"|commandSha256={digest}|gate={gate_name}|status=passed"
                  )
                  matches = [marker for marker in markers if marker == expected_marker]
                  if len(matches) != 1:
                      raise SystemExit(
                          f"{description} marker commandSha256 does not match the normalized command"
                      )
                  binding_count += 1

              if is_matrix:
                  aggregate_markers = gate.get("markers")
                  if (not isinstance(aggregate_markers, list)
                          or any(type(marker) is not str or not marker.strip() for marker in aggregate_markers)
                          or len(set(aggregate_markers)) != len(aggregate_markers)):
                      raise SystemExit(f"Issue #5 gate {gate_name}.markers is not a unique non-empty string array")
                  expected_aggregate_markers = {
                      marker
                      for run in runs
                      for marker in run.get("markers", [])
                  }
                  if any(aggregate_markers.count(marker) != 1 for marker in expected_aggregate_markers):
                      raise SystemExit(f"Issue #5 gate {gate_name}.markers does not retain every run marker exactly once")
                  for platform in ("linux", "windows", "macos"):
                      required_prefixes = issue5_required_prefixes.get(gate_name, {}).get(platform, ())
                      if gate_name == "restartResidualProcessReconciliation":
                          required_ok = any(any(issue5_marker_matches(marker, prefix) for marker in aggregate_markers)
                                            for prefix in required_prefixes)
                      else:
                          required_ok = all(any(issue5_marker_matches(marker, prefix) for marker in aggregate_markers)
                                             for prefix in required_prefixes)
                      if not required_ok:
                          raise SystemExit(f"Issue #5 gate {gate_name}.markers is missing the retained native marker for {platform}")

          raw_markers = issue5_records[0].get("markers")
          if (not isinstance(raw_markers, list)
                  or any(type(marker) is not str or not marker.strip() for marker in raw_markers)
                  or len(set(raw_markers)) != len(raw_markers)):
              raise SystemExit("Issue #5 aggregate markers are not a unique non-empty string array")

          if len(seen_gates) != 9 or binding_count != 15:
              raise SystemExit("Issue #5 marker command bindings are incomplete")
          print(f"Issue #5 marker commandSha256 bindings verified: {binding_count}")

          # Recompute the Issue #3 semantic marker digests independently from
          # the downloaded raw-log verification.  PowerShell performs the
          # contract-bound parse; this second implementation makes sure a
          # syntactically valid marker cannot be detached from the normalized
          # command or selector before the stable JQ cross-bind runs.
          issue3_records = [
              record for record in records
              if isinstance(record, dict) and record.get("issue") == "issue3"
          ]
          if len(issue3_records) != 1:
              raise SystemExit("Issue #3 raw-log verification must contain exactly one record")
          issue3_gate_evidence = issue3_records[0].get("gateEvidence")
          if not isinstance(issue3_gate_evidence, list) or len(issue3_gate_evidence) != 11:
              raise SystemExit("Issue #3 raw-log verification must retain all eleven gate records")
          for gate in issue3_gate_evidence:
              if not isinstance(gate, dict):
                  raise SystemExit("Issue #3 gate evidence entry is not an object")
              gate_name = gate.get("gate")
              required_fields = ("target", "platform", "hostArchitecture", "architecture",
                                 "coverageTargets", "rustTarget", "kitTarget", "operation",
                                 "commandId", "selectorId", "command", "testSelector", "markers")
              if not isinstance(gate_name, str) or any(field not in gate for field in required_fields):
                  raise SystemExit(f"Issue #3 gate {gate_name!r} is missing semantic fields")
              if not isinstance(gate["coverageTargets"], list) or not gate["coverageTargets"]:
                  raise SystemExit(f"Issue #3 gate {gate_name} has no coverage targets")
              normalized = normalized_command(gate["command"], f"Issue #3 gate {gate_name}")
              selector = gate["testSelector"]
              if not isinstance(selector, str) or not selector.strip():
                  raise SystemExit(f"Issue #3 gate {gate_name} selector is invalid")
              command_digest = hashlib.sha256(normalized.encode("utf-8")).hexdigest()
              selector_digest = hashlib.sha256(normalized_command(selector, f"Issue #3 gate {gate_name} selector").encode("utf-8")).hexdigest()
              coverage = ",".join(sorted(str(value).lower() for value in gate["coverageTargets"]))
              expected_semantic = (
                  f"CYC-GA-ISSUE3|v=2|gate={gate_name}|target={gate['target']}"
                  f"|platform={gate['platform']}|hostArchitecture={gate['hostArchitecture']}"
                  f"|architecture={gate['architecture']}|coverageTargets={coverage}"
                  f"|rustTarget={gate['rustTarget']}|kitTarget={gate['kitTarget']}"
                  f"|operation={gate['operation']}|selectorSha256={selector_digest}"
                  f"|commandSha256={command_digest}|status=passed"
              )
              markers = gate["markers"]
              if not isinstance(markers, list) or markers.count(expected_semantic) != 1:
                  raise SystemExit(f"Issue #3 gate {gate_name} semantic marker is not bound to command and selector")
          print("Issue #3 semantic marker command/selector bindings verified: 11")
          PY
          raw_verification_contract="$RUNNER_TEMP/cyc-ga-raw-log-contract.jq"
          cat > "$raw_verification_contract" <<'JQ'
            def string_value($value):
              if (($value | type) == "string") then $value else "" end;
            def nonempty_string($value):
              (string_value($value) | test("[^[:space:]]"));
            def integer_count($value; $positive):
              (($value | type) == "number")
              and ($value == ($value | floor))
              and ($value >= 0)
              and ($value <= 1000000000)
              and (if $positive then $value > 0 else true end);
            def normalized_command:
              gsub("[[:space:]]+"; " ") | sub("^ +"; "") | sub(" +$"; "");
            def valid_iso_instant($value):
              (string_value($value) | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^[:space:]]+(Z|[+-][0-9]{2}:[0-9]{2})$"));
            def iso_epoch:
              capture("^(?<date>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})(?<fraction>\\.[0-9]+)?(?<zone>Z|[+-][0-9]{2}:[0-9]{2})$") as $parts
              | (($parts.date + "Z") | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) as $base
              | (($parts.fraction // ".0") | tonumber) as $fraction
              | (if $parts.zone == "Z" then 0
                 else ($parts.zone | capture("^(?<sign>[+-])(?<hours>[0-9]{2}):(?<minutes>[0-9]{2})$")) as $offset
                   | (($offset.hours | tonumber) * 3600 + ($offset.minutes | tonumber) * 60)
                     * (if $offset.sign == "+" then 1 else -1 end)
                 end) as $offsetSeconds
              | $base + $fraction - $offsetSeconds;
            def same_instant($left; $right):
              (try ($left | iso_epoch) catch null) as $leftEpoch
              | (try ($right | iso_epoch) catch null) as $rightEpoch
              | ($leftEpoch != null and $rightEpoch != null and $leftEpoch == $rightEpoch);
            def valid_iso_order($started; $ended):
              (try ($started | iso_epoch) catch null) as $startedEpoch
