name: Protected stable GA readiness

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact stable vX.Y.Z tag to verify
        required: true
        type: string
      evidence_url:
        description: HTTPS URL of the externally captured GA evidence manifest
        required: true
        type: string
      evidence_sha256:
        description: SHA-256 digest of the external GA evidence manifest
        required: true
        type: string
      stable_assets_url:
        description: HTTPS URL of the externally built stable asset bundle (.zip)
        required: true
        type: string
      stable_assets_sha256:
        description: SHA-256 digest of the externally built stable asset bundle
        required: true
        type: string
      attestation_signer_repo:
        description: Owner/repository of the external stable payload builder
        required: true
        type: string
      attestation_signer_workflow:
        description: Full owner/repository/.github/workflows/file.yml path of the stable builder
        required: true
        type: string
      attestation_cert_identity:
        description: Exact Sigstore certificate identity for the stable builder at the source tag
        required: true
        type: string
      attestation_signer_digest:
        description: Exact 40-character workflow digest for the external stable builder
        required: true
        type: string

permissions:
  contents: read
  issues: read

jobs:
  ga-readiness:
    name: Verify stable GA evidence (external hosts required)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues: read
    env:
      CYC_GA_SOURCE_TAG: ${{ inputs.source_tag }}
      CYC_GA_EVIDENCE_URL: ${{ inputs.evidence_url }}
      CYC_GA_EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
      GH_TOKEN: ${{ github.token }}
      # The branch-protection REST endpoint requires Administration:read,
      # which is unavailable to GITHUB_TOKEN. If configured, this token is
      # used only for that endpoint; an absent token intentionally fails closed.
      CYC_GA_GOVERNANCE_TOKEN: ${{ secrets.CYC_GA_GOVERNANCE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0

      - name: Verify exact stable tag and reviewed source commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CYC_GA_SOURCE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "source_tag must be a stable vX.Y.Z tag" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$CYC_GA_SOURCE_TAG")" != 'tag' ]]; then
            echo "source_tag must resolve to an annotated tag" >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          tag_object="$(git rev-parse "refs/tags/$CYC_GA_SOURCE_TAG")"
          tag_commit="$(git rev-parse "refs/tags/$CYC_GA_SOURCE_TAG^{commit}")"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "source tag does not resolve to the checked-out commit" >&2
            exit 1
          fi
          echo "CYC_GA_SOURCE_COMMIT=$head_commit" >> "$GITHUB_ENV"
          echo "CYC_GA_SOURCE_TAG_OBJECT=$tag_object" >> "$GITHUB_ENV"
          {
            echo "## Stable GA source"
            echo
            echo "- tag: `$CYC_GA_SOURCE_TAG`"
            echo "- commit: `$head_commit`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every remote GitHub Action is commit-pinned
        shell: pwsh
        run: ./scripts/Test-GitHubActionPins.ps1

      - name: Verify stable product version identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = (& ./scripts/Test-VersionConsistency.ps1 `
            -SourceTag $env:CYC_GA_SOURCE_TAG `
            -SkipNegativeTests `
            -Json) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Stable version consistency gate failed with exit code $LASTEXITCODE."
          }
          if ([string]$result.releaseChannel -cne 'stable' -or
              [string]$result.productVersion -cne $env:CYC_GA_SOURCE_TAG.Substring(1)) {
            throw "Stable version identity is inconsistent with $env:CYC_GA_SOURCE_TAG."
          }

      - name: Download and hash externally captured GA evidence
        shell: bash
        run: |
          set -euo pipefail
          case "$CYC_GA_EVIDENCE_URL" in
            https://*) ;;
            *) echo "evidence_url must use HTTPS" >&2; exit 1 ;;
          esac
          python3 ./scripts/Test-ExternalHttpsUrl.py "$CYC_GA_EVIDENCE_URL"
          if [[ ! "$CYC_GA_EVIDENCE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "evidence_sha256 must be a 64-character SHA-256 digest" >&2
            exit 1
          fi
          evidence_path="$RUNNER_TEMP/cyc-ga-evidence.json"
          curl --fail --location --max-redirs 0 --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 2 --connect-timeout 20 --max-time 300 \
            --max-filesize 67108864 --output "$evidence_path" "$CYC_GA_EVIDENCE_URL"
          if [[ "$(stat -c '%s' "$evidence_path")" -gt 67108864 ]]; then
            echo 'external GA evidence exceeds the 64 MiB size limit' >&2
            exit 1
          fi
          actual_hash="$(sha256sum "$evidence_path" | awk '{print tolower($1)}')"
          expected_hash="$(printf '%s' "$CYC_GA_EVIDENCE_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_hash" != "$expected_hash" ]]; then
            echo "external GA evidence SHA-256 does not match evidence_sha256" >&2
            exit 1
          fi
          echo "CYC_GA_EVIDENCE_PATH=$evidence_path" >> "$GITHUB_ENV"

      - name: Download and verify each retained GA raw log
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $readinessDirectory = Join-Path $env:RUNNER_TEMP 'cyc-ga-readiness'
          $outputDirectory = Join-Path $readinessDirectory 'raw-logs'
          & ./scripts/Test-GARawLogs.ps1 `
            -EvidencePath $env:CYC_GA_EVIDENCE_PATH `
            -OutputDirectory $outputDirectory `
            -ExpectedCommit $env:CYC_GA_SOURCE_COMMIT | Out-Host
          $verificationPath = Join-Path $outputDirectory 'raw-log-verification.json'
          if (-not (Test-Path -LiteralPath $verificationPath -PathType Leaf)) {
            throw "Raw-log verification report was not written: $verificationPath"
          }
          "CYC_GA_RAW_LOG_VERIFICATION_PATH=$verificationPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Snapshot live issue gates and repository governance
        shell: bash
        run: |
          set -euo pipefail
          gate_dir="$RUNNER_TEMP/cyc-ga-readiness"
          mkdir -p "$gate_dir"
          gh_governance_api() {
            if [[ -n "${CYC_GA_GOVERNANCE_TOKEN:-}" ]]; then
              GH_TOKEN="$CYC_GA_GOVERNANCE_TOKEN" gh api "$@"
            else
              gh api "$@"
            fi
          }
          for number in 2 3 5; do
            if gh api "repos/$GITHUB_REPOSITORY/issues/$number" > "$gate_dir/issue-$number.json"; then
              :
            else
              printf '{"number":%s,"state":"api-error"}\n' "$number" > "$gate_dir/issue-$number.json"
            fi
          done
          jq -n \
            --slurpfile issue2 "$gate_dir/issue-2.json" \
            --slurpfile issue3 "$gate_dir/issue-3.json" \
            --slurpfile issue5 "$gate_dir/issue-5.json" \
            '{issues: [$issue2[0], $issue3[0], $issue5[0]]}' \
            > "$gate_dir/issues.json"

          if gh api "repos/$GITHUB_REPOSITORY" > "$gate_dir/repository.json"; then
            :
          else
            printf '{"default_branch":"","apiError":true}\n' > "$gate_dir/repository.json"
          fi
          default_branch="$(jq -r '.default_branch // empty' "$gate_dir/repository.json")"
          if [[ -z "$default_branch" ]]; then
            echo 'repository metadata did not provide a default branch' >&2
            exit 1
          fi
          encoded_branch="$(jq -rn --arg branch "$default_branch" '$branch | @uri')"
          # The branch endpoint exposes both the authoritative `protected`
          # flag and `protection.enabled`. The separate protection endpoint
          # supplies the force-push/deletion/admin-enforcement controls.
          if gh api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch" > "$gate_dir/branch.json"; then
            :
          else
            printf '{"name":"","protected":false,"protection":{"enabled":false},"apiError":true}\n' > "$gate_dir/branch.json"
          fi
          if gh_governance_api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch/protection" > "$gate_dir/branch-protection.json"; then
            :
          else
            printf '{"allow_force_pushes":{"enabled":true},"allow_deletions":{"enabled":true},"enforce_admins":{"enabled":false},"apiError":true}\n' > "$gate_dir/branch-protection.json"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$gate_dir/production-environment.json"; then
            :
          else
            printf '{"name":"production","can_admins_bypass":true,"protection_rules":[],"apiError":true}\n' > "$gate_dir/production-environment.json"
          fi
          # Test-GAReadiness requires a non-empty required_reviewers list and
          # `prevent_self_review=true`; a missing or malformed snapshot fails closed.
          if gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" > "$gate_dir/deployment-policies.json"; then
            :
          else
            printf '{"branch_policies":[],"apiError":true}\n' > "$gate_dir/deployment-policies.json"
          fi
          jq -n \
            --arg defaultBranch "$default_branch" \
            --slurpfile branch "$gate_dir/branch.json" \
            --slurpfile branchProtection "$gate_dir/branch-protection.json" \
            --slurpfile environment "$gate_dir/production-environment.json" \
            --slurpfile policies "$gate_dir/deployment-policies.json" \
            '{defaultBranch: $defaultBranch, branchProtection: ($branch[0] + {protectionDetails: $branchProtection[0]}), productionEnvironment: $environment[0], deploymentBranchPolicies: $policies[0]}' \
            > "$gate_dir/controls.json"
          echo "CYC_GA_ISSUE_SNAPSHOT_PATH=$gate_dir/issues.json" >> "$GITHUB_ENV"
          echo "CYC_GA_CONTROLS_PATH=$gate_dir/controls.json" >> "$GITHUB_ENV"
          echo "CYC_GA_REPORT_DIR=$gate_dir" >> "$GITHUB_ENV"

      - name: Verify GA evidence, issue closure, and governance controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:CYC_GA_REPORT_DIR 'ga-readiness.json'
          try {
            $resultLines = @(& ./scripts/Test-GAReadiness.ps1 `
              -RepositoryRoot $PWD `
              -ExpectedTag $env:CYC_GA_SOURCE_TAG `
              -ExpectedCommit $env:CYC_GA_SOURCE_COMMIT `
              -EvidencePath $env:CYC_GA_EVIDENCE_PATH `
              -RawLogVerificationPath $env:CYC_GA_RAW_LOG_VERIFICATION_PATH `
              -IssueSnapshotPath $env:CYC_GA_ISSUE_SNAPSHOT_PATH `
              -ControlsPath $env:CYC_GA_CONTROLS_PATH `
              -Json)
            $readinessExitCode = $LASTEXITCODE
            if ($readinessExitCode -ne 0) {
              throw "GA readiness gate process exited with code $readinessExitCode."
            }
            if ($resultLines.Count -eq 0) {
              throw 'GA readiness gate produced no JSON result.'
            }
            $resultJson = $resultLines -join "`n"
            $result = $resultJson | ConvertFrom-Json
            if ([string]$result.status -cne 'passed') {
              throw "GA readiness gate returned unexpected status '$($result.status)'."
            }
            $resultJson | Set-Content -LiteralPath $reportPath -Encoding UTF8
            $resultJson | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          } catch {
            [string]$_.Exception.Message | Set-Content -LiteralPath $reportPath -Encoding UTF8
            throw
          }

      - name: Upload GA gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ClusterYourCodex-ga-readiness-${{ inputs.source_tag }}
          path: ${{ runner.temp }}/cyc-ga-readiness/*
          if-no-files-found: warn
          retention-days: 30

  stable-publisher:
    name: Publish verified stable release
    if: needs.ga-readiness.result == 'success'
    needs: [ga-readiness]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      issues: read
      attestations: read
    env:
      CYC_GA_SOURCE_TAG: ${{ inputs.source_tag }}
      CYC_GA_EVIDENCE_URL: ${{ inputs.evidence_url }}
      CYC_GA_EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
      CYC_STABLE_ASSET_URL: ${{ inputs.stable_assets_url }}
      CYC_STABLE_ASSET_SHA256: ${{ inputs.stable_assets_sha256 }}
      CYC_GA_ATTESTATION_SIGNER_REPO: ${{ inputs.attestation_signer_repo }}
      CYC_GA_ATTESTATION_SIGNER_WORKFLOW: ${{ inputs.attestation_signer_workflow }}
      CYC_GA_ATTESTATION_CERT_IDENTITY: ${{ inputs.attestation_cert_identity }}
      CYC_GA_ATTESTATION_SIGNER_DIGEST: ${{ inputs.attestation_signer_digest }}
      # These values are protected production-environment policy, not
      # operator-controlled dispatch inputs. The request must match the
      # reviewed stable builder exactly.
      CYC_GA_TRUSTED_BUILDER_REPO: ${{ secrets.CYC_GA_TRUSTED_BUILDER_REPO }}
      CYC_GA_TRUSTED_BUILDER_WORKFLOW: ${{ secrets.CYC_GA_TRUSTED_BUILDER_WORKFLOW }}
      CYC_GA_TRUSTED_BUILDER_DIGEST: ${{ secrets.CYC_GA_TRUSTED_BUILDER_DIGEST }}
      # The branch-protection REST endpoint requires Administration:read;
      # this optional token is scoped to governance probes only.
      CYC_GA_GOVERNANCE_TOKEN: ${{ secrets.CYC_GA_GOVERNANCE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0

      - name: Verify exact stable source tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git cat-file -t "refs/tags/$CYC_GA_SOURCE_TAG")" != 'tag' ]]; then
            echo "source_tag must resolve to an annotated tag" >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          tag_object="$(git rev-parse "refs/tags/$CYC_GA_SOURCE_TAG")"
          tag_commit="$(git rev-parse "refs/tags/$CYC_GA_SOURCE_TAG^{commit}")"
          test "$head_commit" = "$tag_commit"
          printf 'CYC_GA_SOURCE_COMMIT=%s\n' "$head_commit" >> "$GITHUB_ENV"
          printf 'CYC_GA_SOURCE_TAG_OBJECT=%s\n' "$tag_object" >> "$GITHUB_ENV"

      - name: Download and verify externally built stable asset bundle
        shell: bash
        run: |
          set -euo pipefail
          case "$CYC_STABLE_ASSET_URL" in
            https://*) ;;
            *) echo "stable_assets_url must use HTTPS" >&2; exit 1 ;;
          esac
          python3 ./scripts/Test-ExternalHttpsUrl.py "$CYC_STABLE_ASSET_URL"
          if [[ ! "$CYC_STABLE_ASSET_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "stable_assets_sha256 must be a 64-character SHA-256 digest" >&2
            exit 1
          fi
          max_bundle_bytes=2147483648
          max_zip_entries=512
          max_entry_uncompressed_bytes=2147483648
          max_total_uncompressed_bytes=8589934592
          bundle="$RUNNER_TEMP/clusteryourcodex-stable-assets.zip"
          curl --fail --location --max-redirs 0 --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 2 --connect-timeout 20 --max-time 300 \
            --max-filesize "$max_bundle_bytes" --output "$bundle" "$CYC_STABLE_ASSET_URL"
          actual_hash="$(sha256sum "$bundle" | awk '{print tolower($1)}')"
          expected_hash="$(printf '%s' "$CYC_STABLE_ASSET_SHA256" | tr '[:upper:]' '[:lower:]')"
          test "$actual_hash" = "$expected_hash"
          # Validate ZIP names and file types before extraction. The stable
          # bundle is externally supplied, so reject traversal, absolute
          # paths, symlinks, and special files before unzip can touch the
          # runner filesystem.
          python3 - "$bundle" "$max_bundle_bytes" "$max_zip_entries" \
            "$max_entry_uncompressed_bytes" "$max_total_uncompressed_bytes" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          max_bundle_bytes = int(sys.argv[2])
          max_zip_entries = int(sys.argv[3])
          max_entry_uncompressed_bytes = int(sys.argv[4])
          max_total_uncompressed_bytes = int(sys.argv[5])
          if archive.stat().st_size > max_bundle_bytes:
              raise SystemExit('stable asset bundle exceeds the compressed-size budget')
          with zipfile.ZipFile(archive) as handle:
              entries = handle.infolist()
              if not entries:
                  raise SystemExit('stable asset bundle ZIP is empty')
              if len(entries) > max_zip_entries:
                  raise SystemExit('stable asset bundle exceeds the ZIP entry budget')
              total_uncompressed = 0
              seen_names = set()
              for entry in entries:
                  name = entry.filename.replace('\\', '/')
                  # Normalize only the separator representation. Empty and
                  # current-directory components are rejected instead of
                  # silently collapsing them, so the duplicate key matches
                  # the path that a downstream extractor will materialize.
                  path_name = name[:-1] if name.endswith('/') else name
                  parts = path_name.split('/') if path_name else []
                  lowered_parts = [part.casefold() for part in parts]
                  namespace_parts = {'globalroot', 'device'}
                  if (not parts or any(part in ('', '.') for part in parts) or
                      '..' in parts or name.startswith('/') or
                      (len(name) >= 2 and name[1] == ':') or
                      any(part in namespace_parts or part.startswith('volume{') for part in lowered_parts)):
                      raise SystemExit(f'unsafe stable bundle ZIP path: {entry.filename!r}')
                  normalized = '/'.join(lowered_parts)
                  if normalized in seen_names:
                      raise SystemExit(f'duplicate stable bundle ZIP path: {entry.filename!r}')
                  seen_names.add(normalized)
                  if entry.flag_bits & 0x1:
                      raise SystemExit(f'encrypted stable bundle ZIP entry: {entry.filename!r}')
                  if entry.file_size < 0 or entry.file_size > max_entry_uncompressed_bytes:
                      raise SystemExit(f'stable bundle ZIP entry exceeds the per-entry budget: {entry.filename!r}')
                  total_uncompressed += entry.file_size
                  if total_uncompressed > max_total_uncompressed_bytes:
                      raise SystemExit('stable asset bundle exceeds the total uncompressed-size budget')
                  mode = (entry.external_attr >> 16) & 0o170000
                  if stat.S_ISLNK(mode) or (mode and not name.endswith('/') and not stat.S_ISREG(mode)):
                      raise SystemExit(f'unsafe stable bundle ZIP entry type: {entry.filename!r}')
          PY
          extract="$RUNNER_TEMP/clusteryourcodex-stable-assets"
          rm -rf "$extract"
          mkdir -p "$extract"
          unzip -q "$bundle" -d "$extract"
          if find "$extract" \( -type l -o -type b -o -type c -o -type p \) -print -quit | grep -q .; then
            echo 'stable asset bundle extraction produced a link or special file' >&2
            exit 1
          fi
          mapfile -t roots < <(find "$extract" -mindepth 1 -maxdepth 1 -type d -print | sort)
          if [[ ${#roots[@]} -eq 1 && -f "${roots[0]}/release-index.json" ]]; then
            bundle_root="${roots[0]}"
          elif [[ -f "$extract/release-index.json" ]]; then
            bundle_root="$extract"
          else
            echo 'stable asset bundle must contain one root with release-index.json' >&2
            exit 1
          fi
          printf 'CYC_STABLE_BUNDLE_ROOT=%s\n' "$bundle_root" >> "$GITHUB_ENV"

      - name: Verify stable bundle identity, sidecars, and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resultLines = @(& ./scripts/Test-StableAssetBundle.ps1 `
            -BundleRoot $env:CYC_STABLE_BUNDLE_ROOT `
            -ExpectedTag $env:CYC_GA_SOURCE_TAG `
            -ExpectedCommit $env:CYC_GA_SOURCE_COMMIT `
            -Json)
          $exitCode = $LASTEXITCODE
          $reportPath = Join-Path $env:RUNNER_TEMP 'cyc-stable-bundle-verification.json'
          $resultLines | Set-Content -LiteralPath $reportPath -Encoding UTF8
          if ($exitCode -ne 0) {
            throw "Stable asset bundle verification failed with exit code $exitCode."
          }
          $result = ($resultLines -join "`n") | ConvertFrom-Json
          if ([string]$result.status -cne 'passed') {
            throw 'Stable asset bundle verification did not return status=passed.'
          }
          "CYC_STABLE_INDEX_SHA256=$([string]$result.indexSha256)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CYC_STABLE_PROVENANCE_BUNDLE_NAME=$([string]$result.provenanceBundleName)" | Add-Content -LiteralPath $env:GITHUB_ENV
          $result | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Cross-bind GA evidence to the downloaded stable index
        shell: bash
        run: |
          set -euo pipefail
          case "$CYC_GA_EVIDENCE_URL" in
            https://*) ;;
            *) echo 'evidence_url must use HTTPS' >&2; exit 1 ;;
          esac
          if [[ ! "$CYC_GA_EVIDENCE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'evidence_sha256 must be a 64-character SHA-256 digest' >&2
            exit 1
          fi
          evidence_path="$RUNNER_TEMP/cyc-ga-evidence.json"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 2 --connect-timeout 20 --max-time 300 \
            --max-filesize 67108864 --output "$evidence_path" "$CYC_GA_EVIDENCE_URL"
          if [[ "$(stat -c '%s' "$evidence_path")" -gt 67108864 ]]; then
            echo 'external GA evidence exceeds the 64 MiB size limit' >&2
            exit 1
          fi
          evidence_hash="$(sha256sum "$evidence_path" | awk '{print tolower($1)}')"
          expected_evidence_hash="$(printf '%s' "$CYC_GA_EVIDENCE_SHA256" | tr '[:upper:]' '[:lower:]')"
          test "$evidence_hash" = "$expected_evidence_hash"
          raw_log_dir="$RUNNER_TEMP/cyc-stable-raw-logs"
          pwsh -NoLogo -NoProfile -File "$GITHUB_WORKSPACE/scripts/Test-GARawLogs.ps1" \
            -EvidencePath "$evidence_path" \
            -OutputDirectory "$raw_log_dir" \
            -ExpectedCommit "$CYC_GA_SOURCE_COMMIT" >/dev/null
          raw_verification="$raw_log_dir/raw-log-verification.json"
          test -f "$raw_verification"
          printf 'CYC_GA_RAW_LOG_VERIFICATION_PATH=%s\n' "$raw_verification" >> "$GITHUB_ENV"
          jq -e --arg commit "$CYC_GA_SOURCE_COMMIT" --slurpfile manifest "$evidence_path" '
            ($manifest[0]) as $m
            | .schemaVersion == "cyc.dev/ga-raw-log-verification/v1"
            and .status == "passed"
            and ((.sourceCommit | type) == "string")
            and ((.sourceCommit | ascii_downcase) == ($commit | ascii_downcase))
            and ((.records | type) == "array" and (.records | length) == 3)
            and ([.records[] | select(.status == "passed" and (.issue == "issue2")
                and .evidenceId == $m.issue2.evidenceId
                and .url == $m.issue2.rawLog.url
                and ((.expectedSha256 | ascii_downcase) == ($m.issue2.rawLog.sha256 | ascii_downcase))
                and ((.actualSha256 | ascii_downcase) == ($m.issue2.rawLog.sha256 | ascii_downcase)))] | length == 1)
            and ([.records[] | select(.status == "passed" and (.issue == "issue3")
                and .evidenceId == $m.issue3.evidenceId
                and .url == $m.issue3.rawLog.url
                and ((.expectedSha256 | ascii_downcase) == ($m.issue3.rawLog.sha256 | ascii_downcase))
                and ((.actualSha256 | ascii_downcase) == ($m.issue3.rawLog.sha256 | ascii_downcase)))] | length == 1)
            and ([.records[] | select(.status == "passed" and (.issue == "issue5")
                and .evidenceId == $m.issue5.evidenceId
                and .url == $m.issue5.rawLog.url
                and ((.expectedSha256 | ascii_downcase) == ($m.issue5.rawLog.sha256 | ascii_downcase))
                and ((.actualSha256 | ascii_downcase) == ($m.issue5.rawLog.sha256 | ascii_downcase)))] | length == 1)
          ' "$raw_verification" >/dev/null
          raw_root="$(cd "$raw_log_dir" && pwd -P)"
          while IFS=$'\t' read -r raw_path raw_hash raw_bytes; do
            test -n "$raw_path"
            resolved_raw_path="$(realpath -e -- "$raw_path")"
            case "$resolved_raw_path" in
              "$raw_root"/*) ;;
              *) echo 'raw-log verification path escaped its output directory' >&2; exit 1 ;;
            esac
            test -f "$resolved_raw_path"
            test "$(sha256sum "$resolved_raw_path" | awk '{print tolower($1)}')" = "$(printf '%s' "$raw_hash" | tr '[:upper:]' '[:lower:]')"
            test "$(stat -c '%s' "$resolved_raw_path")" = "$raw_bytes"
          done < <(jq -r '.records[] | [.path, .actualSha256, .bytes] | @tsv' "$raw_verification")
          bundle_index_hash="$(sha256sum "$CYC_STABLE_BUNDLE_ROOT/release-index.json" | awk '{print tolower($1)}')"
          test "$bundle_index_hash" = "$(printf '%s' "$CYC_STABLE_INDEX_SHA256" | tr '[:upper:]' '[:lower:]')"
          evidence_index_hash="$(jq -r '.artifactVerification.indexSha256 // empty' "$evidence_path" | tr '[:upper:]' '[:lower:]')"
          [[ "$evidence_index_hash" =~ ^[0-9a-f]{64}$ ]]
          test "$evidence_index_hash" = "$bundle_index_hash"
          jq -e --arg tag "$CYC_GA_SOURCE_TAG" --arg commit "$CYC_GA_SOURCE_COMMIT" \
            '
              def string_value($value):
                if (($value | type) == "string") then $value else "" end;
              def nonempty_string($value):
                (string_value($value) | length) > 0;
              def sha256($value):
                (string_value($value) | test("^[0-9a-fA-F]{64}$"));
              def valid_https_url($value):
                (string_value($value) | test("^https://[^@/?#[:space:]]+([/?#]|$)"));
              def valid_iso_instant($value):
                (string_value($value) | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^[:space:]]+(Z|[+-][0-9]{2}:[0-9]{2})$"));
              def valid_raw_log($record):
                (($record.rawLog | type) == "object")
                and nonempty_string($record.rawLog.url)
                and valid_https_url($record.rawLog.url)
                and sha256($record.rawLog.sha256)
                and nonempty_string($record.rawLog.command)
                and nonempty_string($record.rawLog.node)
                and ((string_value($record.rawLog.node) | test("github|actions|hosted|runner"; "i")) | not)
                and valid_iso_instant($record.rawLog.startedAt)
                and valid_iso_instant($record.rawLog.endedAt)
                and (($record.rawLog.exitCode | type) == "number")
                and ($record.rawLog.exitCode == 0)
                and (($record.rawLog.tests | type) == "object")
                and (($record.rawLog.tests.passed | type) == "number")
                and (($record.rawLog.tests.failed | type) == "number")
                and (($record.rawLog.tests.ignored | type) == "number")
                and ($record.rawLog.tests.passed >= 0)
                and ($record.rawLog.tests.failed == 0)
                and ($record.rawLog.tests.ignored >= 0)
                and ($record.rawLog.cleanup == true);
              def all_gates($record; $gates):
                ([$gates[] as $gate | ($record.gates[$gate] // false) == true] | all);
              def valid_issue_evidence($record; $gates):
                (($record | type) == "object")
                and ($record.status == "passed")
                and (string_value($record.sourceCommit) | test("^[0-9a-fA-F]{40}$"))
                and ((string_value($record.sourceCommit) | ascii_downcase) == ($commit | ascii_downcase))
                and nonempty_string($record.provider)
                and ((string_value($record.provider) | test("github|actions|hosted|runner"; "i")) | not)
                and nonempty_string($record.hostType)
                and ((string_value($record.hostType) | test("github|actions|hosted|runner"; "i")) | not)
                and (string_value($record.evidenceId) | test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"))
                and valid_raw_log($record)
                and all_gates($record; $gates);
              .schemaVersion == "cyc.dev/ga-evidence/v1"
              and .status == "passed"
              and .sourceTag == $tag
              and (string_value(.sourceCommit) | ascii_downcase) == ($commit | ascii_downcase)
              and valid_issue_evidence(.issue2; [
                "tauriDesktopHostTray",
                "rendererNativeControllerProxy",
                "perUserScheduledTasks",
                "sidScopedDataDirAcl",
                "bundledMcpInstallerMarketplace",
                "installRepairUpgradeRollbackUninstall",
                "cleanWindows11Vm",
                "liveWindowsControllerWorkerRoundTrip",
                "productionAuthenticodeSetupHelper",
                "signedNMinus1ToNUpgrade",
                "interruptedUpgradeRollback",
                "downgradePolicy",
                "noOpenUnwaivedP0P1Blocker"
              ])
              and valid_issue_evidence(.issue3; [
                "linuxSystemdUserServicePackage",
                "macosLaunchAgentPackage",
                "linuxX64ReleaseArtifact",
                "macosX64ReleaseArtifact",
                "macosArm64ReleaseArtifact",
                "platformNativeShells",
                "platformNativeProcessGroups",
                "crossPlatformPathAclTests",
                "liveMacosRun",
                "liveLinuxControllerWorkerRoundTrip",
                "macosDeveloperIdSigningNotarization"
              ])
              and valid_issue_evidence(.issue5; [
                "linuxDedicatedExecutionIdentity",
                "linuxCgroupV2Reconciliation",
                "windowsIsolatedExecutionIdentity",
                "windowsJobObject",
                "windowsProtectedExternalGuard",
                "macosExternalReconciliation",
                "jobsCannotAlterGuardState",
                "jobsCannotReadWorkerCredentials",
                "restartResidualProcessReconciliation"
              ])
              and ([.issue2.evidenceId, .issue3.evidenceId, .issue5.evidenceId] | unique | length == 3)
              and ([.issue2.rawLog.url, .issue3.rawLog.url, .issue5.rawLog.url] | unique | length == 3)
            ' \
            "$evidence_path" >/dev/null
          echo "GA evidence, issue3/issue5 acceptance gates, and stable release-index are source-bound to $bundle_index_hash" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every stable payload attestation cryptographically
        shell: bash
        run: |
          set -euo pipefail
          index="$CYC_STABLE_BUNDLE_ROOT/release-index.json"
          bundle="$CYC_STABLE_BUNDLE_ROOT/$CYC_STABLE_PROVENANCE_BUNDLE_NAME"
          test -f "$bundle"
          : "${CYC_GA_ATTESTATION_SIGNER_REPO:?missing attestation signer repository input}"
          : "${CYC_GA_ATTESTATION_SIGNER_WORKFLOW:?missing attestation signer workflow input}"
          : "${CYC_GA_ATTESTATION_CERT_IDENTITY:?missing attestation certificate identity input}"
          : "${CYC_GA_ATTESTATION_SIGNER_DIGEST:?missing attestation signer digest input}"
          : "${CYC_GA_TRUSTED_BUILDER_REPO:?missing protected CYC_GA_TRUSTED_BUILDER_REPO production secret}"
          : "${CYC_GA_TRUSTED_BUILDER_WORKFLOW:?missing protected CYC_GA_TRUSTED_BUILDER_WORKFLOW production secret}"
          : "${CYC_GA_TRUSTED_BUILDER_DIGEST:?missing protected CYC_GA_TRUSTED_BUILDER_DIGEST production secret}"
          if [[ ! "$CYC_GA_ATTESTATION_SIGNER_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'attestation signer repository input is not an owner/repository name' >&2
            exit 1
          fi
          if [[ "$CYC_GA_ATTESTATION_SIGNER_REPO" != "$CYC_GA_TRUSTED_BUILDER_REPO" ]]; then
            echo 'attestation signer repository input does not match protected stable-builder policy' >&2
            exit 1
          fi
          if [[ "$CYC_GA_ATTESTATION_SIGNER_REPO" == "$GITHUB_REPOSITORY" ]]; then
            echo 'stable attestation signer must be an external repository' >&2
            exit 1
          fi
          case "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" in
            "$CYC_GA_ATTESTATION_SIGNER_REPO"/.github/workflows/*.yml|"$CYC_GA_ATTESTATION_SIGNER_REPO"/.github/workflows/*.yaml) ;;
            *) echo 'attestation signer workflow input is outside the configured repository workflow directory' >&2; exit 1 ;;
          esac
          if [[ "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" != "$CYC_GA_TRUSTED_BUILDER_WORKFLOW" ]]; then
            echo 'attestation signer workflow input does not match protected stable-builder policy' >&2
            exit 1
          fi
          if [[ ! "$CYC_GA_ATTESTATION_SIGNER_DIGEST" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'attestation signer digest input must be a full 40-character commit SHA' >&2
            exit 1
          fi
          if [[ "$CYC_GA_ATTESTATION_SIGNER_DIGEST" != "$CYC_GA_TRUSTED_BUILDER_DIGEST" ]]; then
            echo 'attestation signer digest input does not match protected stable-builder policy' >&2
            exit 1
          fi
          if [[ "$CYC_GA_TRUSTED_BUILDER_WORKFLOW" == *'..'* ||
                "$CYC_GA_TRUSTED_BUILDER_WORKFLOW" == *[[:space:]]* ]]; then
            echo 'protected stable-builder workflow policy contains unsafe path syntax' >&2
            exit 1
          fi
          if [[ "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" == "$CYC_GA_ATTESTATION_SIGNER_REPO/.github/workflows/release.yml" ||
                "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" == "$CYC_GA_ATTESTATION_SIGNER_REPO/.github/workflows/release.yaml" ]]; then
            echo 'stable attestation signer must be a stable external builder, not prerelease release.yml' >&2
            exit 1
          fi
          signer_workflow_path="${CYC_GA_ATTESTATION_SIGNER_WORKFLOW#"$CYC_GA_ATTESTATION_SIGNER_REPO"/}"
          expected_cert_identity="https://github.com/$CYC_GA_ATTESTATION_SIGNER_REPO/$signer_workflow_path@refs/tags/$CYC_GA_SOURCE_TAG"
          if [[ "$CYC_GA_ATTESTATION_CERT_IDENTITY" != "$expected_cert_identity" ]]; then
            echo 'attestation certificate identity must bind exactly to the signer workflow and stable source tag' >&2
            exit 1
          fi
          attestation_dir="$RUNNER_TEMP/cyc-stable-attestations"
          mkdir -p "$attestation_dir"
          mapfile -t subjects < <(jq -r '.artifacts[].name' "$index")
          [[ ${#subjects[@]} -gt 0 ]]
          for subject in "${subjects[@]}"; do
            output="$attestation_dir/$(printf '%s' "$subject" | sha256sum | awk '{print $1}').json"
            gh attestation verify "$CYC_STABLE_BUNDLE_ROOT/$subject" \
              --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-repo "$CYC_GA_ATTESTATION_SIGNER_REPO" \
              --signer-workflow "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" \
              --signer-digest "$CYC_GA_ATTESTATION_SIGNER_DIGEST" \
              --cert-identity "$CYC_GA_ATTESTATION_CERT_IDENTITY" \
              --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --deny-self-hosted-runners \
              --source-digest "$CYC_GA_SOURCE_COMMIT" \
              --source-ref "refs/tags/$CYC_GA_SOURCE_TAG" \
              --predicate-type 'https://slsa.dev/provenance/v1' \
              --format json > "$output"
            jq -e 'type == "array" and length > 0' "$output" >/dev/null
          done
          echo "Verified cryptographic provenance for ${#subjects[@]} indexed payload artifacts" >> "$GITHUB_STEP_SUMMARY"

      - name: Revalidate final governance, issues, tag, and release state before publish
        shell: bash
        run: |
          set -euo pipefail
          final_gate_dir="$RUNNER_TEMP/cyc-ga-final"
          mkdir -p "$final_gate_dir"
          gh_governance_api() {
            if [[ -n "${CYC_GA_GOVERNANCE_TOKEN:-}" ]]; then
              GH_TOKEN="$CYC_GA_GOVERNANCE_TOKEN" gh api "$@"
            else
              gh api "$@"
            fi
          }
          for number in 2 3 5; do
            if gh api "repos/$GITHUB_REPOSITORY/issues/$number" > "$final_gate_dir/issue-$number.json"; then
              :
            else
              printf '{"number":%s,"state":"api-error"}\n' "$number" > "$final_gate_dir/issue-$number.json"
            fi
          done
          jq -n \
            --slurpfile issue2 "$final_gate_dir/issue-2.json" \
            --slurpfile issue3 "$final_gate_dir/issue-3.json" \
            --slurpfile issue5 "$final_gate_dir/issue-5.json" \
            '{issues: [$issue2[0], $issue3[0], $issue5[0]]}' \
            > "$final_gate_dir/issues.json"

          if gh api "repos/$GITHUB_REPOSITORY" > "$final_gate_dir/repository.json"; then
            :
          else
            printf '{"default_branch":"","apiError":true}\n' > "$final_gate_dir/repository.json"
          fi
          default_branch="$(jq -r '.default_branch // empty' "$final_gate_dir/repository.json")"
          if [[ -z "$default_branch" ]]; then
            echo 'final repository snapshot did not provide a default branch' >&2
            exit 1
          fi
          encoded_branch="$(jq -rn --arg branch "$default_branch" '$branch | @uri')"
          if gh api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch" > "$final_gate_dir/branch.json"; then
            :
          else
            printf '{"name":"","protected":false,"protection":{"enabled":false},"apiError":true}\n' > "$final_gate_dir/branch.json"
          fi
          if gh_governance_api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch/protection" > "$final_gate_dir/branch-protection.json"; then
            :
          else
            printf '{"allow_force_pushes":{"enabled":true},"allow_deletions":{"enabled":true},"enforce_admins":{"enabled":false},"apiError":true}\n' > "$final_gate_dir/branch-protection.json"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$final_gate_dir/production-environment.json"; then
            :
          else
            printf '{"name":"production","can_admins_bypass":true,"protection_rules":[],"apiError":true}\n' > "$final_gate_dir/production-environment.json"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" > "$final_gate_dir/deployment-policies.json"; then
            :
          else
            printf '{"branch_policies":[],"apiError":true}\n' > "$final_gate_dir/deployment-policies.json"
          fi
          jq -S -n \
            --arg defaultBranch "$default_branch" \
            --slurpfile branch "$final_gate_dir/branch.json" \
            --slurpfile branchProtection "$final_gate_dir/branch-protection.json" \
            --slurpfile environment "$final_gate_dir/production-environment.json" \
            --slurpfile policies "$final_gate_dir/deployment-policies.json" \
            '{defaultBranch: $defaultBranch, branchProtection: ($branch[0] + {protectionDetails: $branchProtection[0]}), productionEnvironment: $environment[0], deploymentBranchPolicies: $policies[0]}' \
            > "$final_gate_dir/controls.json"
          final_snapshot="$final_gate_dir/final-snapshot.json"
          jq -S -n \
            --arg schemaVersion 'cyc.dev/ga-final-snapshot/v1' \
            --arg tag "$CYC_GA_SOURCE_TAG" \
            --arg commit "$CYC_GA_SOURCE_COMMIT" \
            --arg indexSha256 "$CYC_STABLE_INDEX_SHA256" \
            --arg bundleSha256 "$CYC_STABLE_ASSET_SHA256" \
            --arg evidenceSha256 "$CYC_GA_EVIDENCE_SHA256" \
            --slurpfile issues "$final_gate_dir/issues.json" \
            --slurpfile controls "$final_gate_dir/controls.json" \
            '{schemaVersion: $schemaVersion, sourceTag: $tag, sourceCommit: $commit, stableIndexSha256: $indexSha256, stableBundleSha256: $bundleSha256, evidenceSha256: $evidenceSha256, issues: $issues[0], controls: $controls[0]}' \
            > "$final_snapshot"
          final_snapshot_hash="$(sha256sum "$final_snapshot" | awk '{print tolower($1)}')"
          printf 'CYC_GA_FINAL_SNAPSHOT_PATH=%s\n' "$final_snapshot" >> "$GITHUB_ENV"
          printf 'CYC_GA_FINAL_SNAPSHOT_SHA256=%s\n' "$final_snapshot_hash" >> "$GITHUB_ENV"

          set +e
          final_result="$(pwsh -NoLogo -NoProfile -File "$GITHUB_WORKSPACE/scripts/Test-GAReadiness.ps1" \
            -RepositoryRoot "$GITHUB_WORKSPACE" \
            -ExpectedTag "$CYC_GA_SOURCE_TAG" \
            -ExpectedCommit "$CYC_GA_SOURCE_COMMIT" \
            -EvidencePath "$RUNNER_TEMP/cyc-ga-evidence.json" \
            -RawLogVerificationPath "$CYC_GA_RAW_LOG_VERIFICATION_PATH" \
            -IssueSnapshotPath "$final_gate_dir/issues.json" \
            -ControlsPath "$final_gate_dir/controls.json" \
            -Json 2>&1)"
          final_result_status=$?
          set -e
          printf '%s\n' "$final_result" > "$final_gate_dir/ga-readiness-final.json"
          if (( final_result_status != 0 )); then
            cat "$final_gate_dir/ga-readiness-final.json" >&2
            exit "$final_result_status"
          fi

          resolve_remote_tag_identity() {
            local tag="$1"
            local encoded_tag ref_json object_type object_sha tag_json depth tag_object_sha
            encoded_tag="$(jq -rn --arg tag "$tag" '$tag | @uri')"
            if ! ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded_tag")"; then
              return 1
            fi
            object_type="$(jq -r '.object.type // empty' <<< "$ref_json")"
            object_sha="$(jq -r '.object.sha // empty' <<< "$ref_json")"
            [[ "$object_type" == 'tag' ]] || return 1
            [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            tag_object_sha="$object_sha"
            for depth in 1 2 3 4; do
              case "$object_type" in
                commit)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  printf '%s %s\n' "$tag_object_sha" "$object_sha"
                  return 0
                  ;;
                tag)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  if ! tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"; then
                    return 1
                  fi
                  object_type="$(jq -r '.object.type // empty' <<< "$tag_json")"
                  object_sha="$(jq -r '.object.sha // empty' <<< "$tag_json")"
                  ;;
                *)
                  return 1
                  ;;
              esac
            done
            return 1
          }
          if ! remote_tag_identity="$(resolve_remote_tag_identity "$CYC_GA_SOURCE_TAG")"; then
            echo 'unable to resolve the remote stable annotated tag before publish' >&2
            exit 1
          fi
          read -r remote_tag_object remote_tag_commit <<< "$remote_tag_identity"
          test "$(printf '%s' "$remote_tag_object" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_TAG_OBJECT" | tr '[:upper:]' '[:lower:]')"
          test "$(printf '%s' "$remote_tag_commit" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_COMMIT" | tr '[:upper:]' '[:lower:]')"

          release_probe="$final_gate_dir/release-probe.txt"
          release_probe_error="$final_gate_dir/release-probe.err"
          encoded_tag="$(jq -rn --arg tag "$CYC_GA_SOURCE_TAG" '$tag | @uri')"
          set +e
          gh release view "$CYC_GA_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2> "$release_probe_error"
          release_view_status=$?
          set -e
          if (( release_view_status == 0 )); then
            echo "stable release already exists for $CYC_GA_SOURCE_TAG" >&2
            exit 1
          fi
          set +e
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag" > "$release_probe" 2>> "$release_probe_error"
          release_api_status=$?
          set -e
          release_http_status="$(awk '$1 ~ /^HTTP\// {status=$2} END {print status}' "$release_probe")"
          if [[ "$release_api_status" -eq 0 || "$release_http_status" != '404' ]]; then
            echo "stable release lookup did not return an unambiguous HTTP 404" >&2
            cat "$release_probe_error" >&2
            exit 1
          fi
          {
            echo "Final GA snapshot SHA-256: $final_snapshot_hash"
            echo "Remote stable tag resolves to reviewed commit: $CYC_GA_SOURCE_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish true stable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t asset_names < <(
            jq -r '.artifacts[] | .name, .sidecar' "$CYC_STABLE_BUNDLE_ROOT/release-index.json"
            printf '%s\n' 'release-index.json' 'release-index.json.sha256' 'release-index.json.sig' 'SHA256SUMS'
          )
          assets=()
          for name in "${asset_names[@]}"; do
            test -f "$CYC_STABLE_BUNDLE_ROOT/$name"
            assets+=("$CYC_STABLE_BUNDLE_ROOT/$name")
          done
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo 'stable asset bundle contains no publishable files' >&2
            exit 1
          fi
          # No --prerelease flag is supplied: this job is the only path that
          # creates a stable release, and it runs behind the production gate.
          gh release create "$CYC_GA_SOURCE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "ClusterYourCodex $CYC_GA_SOURCE_TAG" \
            --notes "GA final governance/issues snapshot SHA-256: $CYC_GA_FINAL_SNAPSHOT_SHA256" \
            --generate-notes
      - name: Re-download and verify published stable assets and tag
        shell: bash
        run: |
          set -euo pipefail
          post_dir="$RUNNER_TEMP/cyc-stable-release-download"
          rm -rf "$post_dir"
          mkdir -p "$post_dir"
          gh release download "$CYC_GA_SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$post_dir" \
            --clobber
          if find "$post_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo 'downloaded stable release contains a directory or non-regular file' >&2
            exit 1
          fi
          expected_assets="$RUNNER_TEMP/cyc-stable-release-expected-assets.txt"
          actual_assets="$RUNNER_TEMP/cyc-stable-release-actual-assets.txt"
          jq -er '.artifacts[] | .name, .sidecar' "$CYC_STABLE_BUNDLE_ROOT/release-index.json" > "$expected_assets"
          printf '%s\n' 'release-index.json' 'release-index.json.sha256' 'release-index.json.sig' 'SHA256SUMS' >> "$expected_assets"
          LC_ALL=C sort -u -o "$expected_assets" "$expected_assets"
          find "$post_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort -u > "$actual_assets"
          if ! cmp -s "$expected_assets" "$actual_assets"; then
            echo 'published stable release asset set differs from the validated stable bundle' >&2
            exit 1
          fi
          while IFS= read -r name; do
            test -f "$post_dir/$name"
            test -f "$CYC_STABLE_BUNDLE_ROOT/$name"
            if ! cmp -s "$post_dir/$name" "$CYC_STABLE_BUNDLE_ROOT/$name"; then
              echo "published stable asset differs from the validated bundle: $name" >&2
              exit 1
            fi
          done < "$expected_assets"
          downloaded_index_hash="$(sha256sum "$post_dir/release-index.json" | awk '{print tolower($1)}')"
          test "$downloaded_index_hash" = "$(printf '%s' "$CYC_STABLE_INDEX_SHA256" | tr '[:upper:]' '[:lower:]')"
          release_json="$(gh release view "$CYC_GA_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft,tagName,body)"
          jq -e --arg tag "$CYC_GA_SOURCE_TAG" --arg snapshot "$CYC_GA_FINAL_SNAPSHOT_SHA256" \
            '.tagName == $tag and .isPrerelease == false and .isDraft == false and (.body | contains("GA final governance/issues snapshot SHA-256: " + $snapshot))' \
            <<< "$release_json" >/dev/null

          resolve_remote_tag_identity() {
            local tag="$1"
            local encoded_tag ref_json object_type object_sha tag_json depth tag_object_sha
            encoded_tag="$(jq -rn --arg tag "$tag" '$tag | @uri')"
            if ! ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded_tag")"; then
              return 1
            fi
            object_type="$(jq -r '.object.type // empty' <<< "$ref_json")"
            object_sha="$(jq -r '.object.sha // empty' <<< "$ref_json")"
            [[ "$object_type" == 'tag' ]] || return 1
            [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            tag_object_sha="$object_sha"
            for depth in 1 2 3 4; do
              case "$object_type" in
                commit)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  printf '%s %s\n' "$tag_object_sha" "$object_sha"
                  return 0
                  ;;
                tag)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  if ! tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"; then
                    return 1
                  fi
                  object_type="$(jq -r '.object.type // empty' <<< "$tag_json")"
                  object_sha="$(jq -r '.object.sha // empty' <<< "$tag_json")"
                  ;;
                *)
                  return 1
                  ;;
              esac
            done
            return 1
          }
          if ! remote_tag_identity="$(resolve_remote_tag_identity "$CYC_GA_SOURCE_TAG")"; then
            echo 'unable to resolve the published stable annotated tag' >&2
            exit 1
          fi
          read -r remote_tag_object remote_tag_commit <<< "$remote_tag_identity"
          test "$(printf '%s' "$remote_tag_object" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_TAG_OBJECT" | tr '[:upper:]' '[:lower:]')"
          test "$(printf '%s' "$remote_tag_commit" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_COMMIT" | tr '[:upper:]' '[:lower:]')"
          echo "Published stable release assets and index re-verified; tag commit is $CYC_GA_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
