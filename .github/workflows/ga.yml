                  issue5_gates[] as $gate
                  | (if (issue5_single_gates | index($gate)) != null
                     then [ $record.gates[$gate] ]
                     else ($record.gates[$gate].runs // [])
                     end)[]
                  | select((type == "object")
                      and ((.runId | type) == "string")
                      and ((.platform | type) == "string"))
                  | { runId: .runId, platform: (.platform | ascii_downcase) }
                ];
              def issue5_run_platform_bindings_valid($record):
                (issue5_run_bindings($record) | group_by(.runId)
                 | map([.[].platform] | unique | length)
                 | all(. == 1));
              def issue5_gate_valid($record; $gate):
                if (issue5_single_gates | index($gate)) != null then
                  issue5_single_gate_valid($record; $gate)
                else
                  issue5_matrix_gate_valid($record; $gate)
                end;
              def issue5_all_gates_valid($record):
                (($record.gates | type) == "object")
                and (($record.gates | keys_unsorted | sort) == (issue5_gates | sort))
                and issue5_run_platform_bindings_valid($record)
                and ([ issue5_gates[] as $gate |
                       select(issue5_gate_valid($record; $gate))
                     ] | length == (issue5_gates | length));
              def issue5_raw_markers_valid($record):
                (issue5_marker_array($record.rawLog)) as $raw_markers
                | ([ issue5_gates[] as $gate |
                       issue5_marker_array($record.gates[$gate])[]
                     ] | unique) as $expected_markers
                | (issue5_markers_valid($raw_markers)
                   and ([ $expected_markers[] as $marker |
                          select([ $raw_markers[] | select(. == $marker) ] | length == 1)
                        ] | length == ($expected_markers | length)));
              def valid_issue5($record):
                (($record | type) == "object")
                and ($record.status == "passed")
                and (string_value($record.sourceCommit) | test("^[0-9a-fA-F]{40}$"))
                and ((string_value($record.sourceCommit) | ascii_downcase) == ($commit | ascii_downcase))
                and nonempty_string($record.provider)
                and ((string_value($record.provider) | test("github|actions|hosted|runner"; "i")) | not)
                and nonempty_string($record.hostType)
                and ((string_value($record.hostType) | test("github|actions|hosted|runner"; "i")) | not)
                and (string_value($record.evidenceId) | test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"))
                and valid_raw_log($record)
                and (($record.rawLog.command | type) == "string")
                and ($record.rawLog.command == "issue5-evidence-matrix")
                and (($record.rawLog.platforms | type) == "array")
                and (($record.rawLog.platforms | map(ascii_downcase) | sort) == (issue5_platforms | sort))
                and issue5_all_gates_valid($record)
                and issue5_raw_markers_valid($record);
              def gate_keys_exact($record; $gates):
                (($record.gates | type) == "object")
                and (($record.gates | keys_unsorted | sort) == ($gates | sort));
              def all_gates($record; $gates):
                ([$gates[] as $gate | ($record.gates[$gate] // false) == true] | all);
              def issue23_gate_names($issue):
                if $issue == "issue2" then
                  ["tauriDesktopHostTray", "rendererNativeControllerProxy", "perUserScheduledTasks", "sidScopedDataDirAcl", "bundledMcpInstallerMarketplace", "installRepairUpgradeRollbackUninstall", "cleanWindows11Vm", "liveWindowsControllerWorkerRoundTrip", "productionAuthenticodeSetupHelper", "signedNMinus1ToNUpgrade", "interruptedUpgradeRollback", "downgradePolicy", "noOpenUnwaivedP0P1Blocker"]
                elif $issue == "issue3" then
                  ["linuxSystemdUserServicePackage", "macosLaunchAgentPackage", "linuxX64ReleaseArtifact", "macosX64ReleaseArtifact", "macosArm64ReleaseArtifact", "platformNativeShells", "platformNativeProcessGroups", "crossPlatformPathAclTests", "liveMacosRun", "liveLinuxControllerWorkerRoundTrip", "macosDeveloperIdSigningNotarization"]
                else [] end;
              def issue23_selector_value($entry):
                if (($entry | has("testSelector")) and ($entry | has("selector"))) then
                  if (($entry.testSelector | type) == "string"
                      and ($entry.selector | type) == "string"
                      and $entry.testSelector == $entry.selector) then $entry.testSelector
                  else "" end
                elif (($entry | has("testSelector")) and (($entry.testSelector | type) == "string")) then
                  $entry.testSelector
                elif (($entry | has("selector")) and (($entry.selector | type) == "string")) then
                  $entry.selector
                else "" end;
            def issue23_marker_array($entry):
              if (($entry | has("rawLogMarkers")) and ($entry | has("markers"))) then
                if (($entry.rawLogMarkers | type) == "array"
                    and ($entry.markers | type) == "array"
                    and $entry.rawLogMarkers == $entry.markers) then $entry.rawLogMarkers
                  else [] end
                elif (($entry | has("rawLogMarkers")) and (($entry.rawLogMarkers | type) == "array")) then
                  $entry.rawLogMarkers
              elif (($entry | has("markers")) and (($entry.markers | type) == "array")) then
                $entry.markers
              else [] end;
            def issue3_gate_contract($gate):
              if (($issue3contract | length) == 1
                  and (($issue3contract[0].gates | type) == "object"))
              then $issue3contract[0].gates[$gate]
              else null end;
            def issue3_all_patterns_match($value; $patterns):
              (nonempty_string($value)
               and (($patterns | type) == "array")
               and (($patterns | length) > 0)
               and ([ $patterns[] as $pattern |
                         select((string_value($value) | test($pattern)) | not)
                       ] | length == 0));
              def issue3_array_exact($actual; $expected):
                (($actual | type) == "array")
                and (($expected | type) == "array")
                and (($actual | length) > 0)
                and ([ $actual[] |
                       select((type != "string") or (length == 0) or (. != ascii_downcase))
                     ] | length == 0)
                and ([ $expected[] |
                       select((type != "string") or (length == 0) or (. != ascii_downcase))
                     ] | length == 0)
                and (($actual | sort) == ($expected | sort))
                and (($actual | unique | length) == ($actual | length));
              def issue3_semantic_marker_valid($entry; $gate; $contract):
                ("CYC-GA-ISSUE3|v=2|gate=" + $gate
                 + "|target=" + string_value($entry.target)
                 + "|platform=" + string_value($entry.platform)
                 + "|hostArchitecture=" + string_value($entry.hostArchitecture)
                 + "|architecture=" + string_value($entry.architecture)
                 + "|coverageTargets=" + (($entry.coverageTargets | sort) | join(","))
                 + "|rustTarget=" + string_value($entry.rustTarget)
                 + "|kitTarget=" + string_value($entry.kitTarget)
                 + "|operation=" + string_value($entry.operation)
                 + "|selectorSha256=") as $prefix
                | ([ issue23_marker_array($entry)[] |
                     select((type == "string")
                            and startswith($prefix)
                            and test("\\|selectorSha256=[0-9a-fA-F]{64}\\|commandSha256=[0-9a-fA-F]{64}\\|status=passed$"))
                   ] | length == 1);
              def issue3_gate_semantics_valid($entry; $gate):
              (issue3_gate_contract($gate)) as $contract
              | (($contract | type) == "object")
                  and (($entry.platform | type) == "string")
                  and ($entry.platform == $contract.platform)
                  and (($entry.hostArchitecture | type) == "string")
                  and (($contract.hostArchitectures | type) == "array")
                  and (($contract.hostArchitectures | index($entry.hostArchitecture)) != null)
                  and (($entry.architecture | type) == "string")
                  and (($contract.architectures | type) == "array")
                  and (($contract.architectures | index($entry.architecture)) != null)
                  and (($entry.target | type) == "string")
                  and ($entry.target == $contract.target)
                  and issue3_array_exact($entry.coverageTargets; $contract.coverageTargets)
                  and (($entry.rustTarget | type) == "string")
                  and (($contract.rustTargets | index($entry.rustTarget)) != null)
                  and (($entry.kitTarget | type) == "string")
                  and (($contract.kitTargets | index($entry.kitTarget)) != null)
                  and (($entry.operation | type) == "string")
                  and ($entry.operation == $contract.operation)
                  and (($entry.commandId | type) == "string")
                  and ($entry.commandId == $contract.commandId)
                  and (($entry.selectorId | type) == "string")
                  and ($entry.selectorId == $contract.selectorId)
                and (($entry.platforms | type) == "array")
                and (($entry.platforms | length) > 0)
                and ([ $entry.platforms[] |
                       select((type != "string") or (. != (ascii_downcase)))
                     ] | length == 0)
                and (($entry.platforms | map(ascii_downcase) | unique | sort)
                     == ($contract.platforms | map(ascii_downcase) | unique | sort))
                and (($entry.platforms | length)
                     == ($entry.platforms | map(ascii_downcase) | unique | length))
                and issue3_all_patterns_match($entry.command; $contract.commandPatterns)
                and issue3_all_patterns_match(issue23_selector_value($entry); $contract.selectorPatterns)
                  and issue3_semantic_marker_valid($entry; $gate; $contract);
            def issue23_gate_matches_manifest($entry; $manifestGate):
              (issue23_selector_value($entry)) as $entrySelector
              | (issue23_selector_value($manifestGate)) as $manifestSelector
              | (issue23_marker_array($entry)) as $entryMarkers
              | (issue23_marker_array($manifestGate)) as $manifestMarkers
              | ($entry.gateId == $manifestGate.gateId)
                and ((string_value($entry.sourceCommit) | ascii_downcase) == (string_value($manifestGate.sourceCommit) | ascii_downcase))
                and ($entry.provider == $manifestGate.provider)
                and ($entry.hostType == $manifestGate.hostType)
                and ($entry.evidenceId == $manifestGate.evidenceId)
                and ($entry.runId == $manifestGate.runId)
                and ($entry.node == $manifestGate.node)
                and ($entry.exitCode == $manifestGate.exitCode)
                and (($entry.tests.passed == $manifestGate.tests.passed)
                     and ($entry.tests.failed == $manifestGate.tests.failed)
                     and ($entry.tests.ignored == $manifestGate.tests.ignored))
                and same_instant($entry.startedAt; $manifestGate.startedAt)
                and same_instant($entry.endedAt; $manifestGate.endedAt)
                and ($entrySelector == $manifestSelector)
                and (($entry.command | normalized_command) == ($manifestGate.command | normalized_command))
                and ($entryMarkers == $manifestMarkers)
                  and (if ($manifestGate | has("commandId")) then
                         ($entry.platform == $manifestGate.platform)
                         and ($entry.hostArchitecture == $manifestGate.hostArchitecture)
                         and ($entry.architecture == $manifestGate.architecture)
                         and ($entry.target == $manifestGate.target)
                         and ($entry.coverageTargets == $manifestGate.coverageTargets)
                         and ($entry.rustTarget == $manifestGate.rustTarget)
                         and ($entry.kitTarget == $manifestGate.kitTarget)
                         and ($entry.operation == $manifestGate.operation)
                         and ($entry.commandId == $manifestGate.commandId)
                         and ($entry.selectorId == $manifestGate.selectorId)
                         and ($entry.platforms == $manifestGate.platforms)
                     else true end)
                and (if ($manifestGate | has("blockerInventory"))
                     then (($entry | has("blockerInventory")) and ($entry.blockerInventory == $manifestGate.blockerInventory))
                     else true end);
            def issue23_markers_valid($markers):
              (($markers | type) == "array")
              and (($markers | length) > 0)
                and ([ $markers[] | select(type != "string" or (length == 0) or (test("^[[:space:]]*$"))) ] | length == 0)
                and (($markers | unique | length) == ($markers | length));
              def issue23_gate_valid($entry; $issue; $gate; $manifestIssue):
                (($entry | type) == "object")
                and ($entry.status == true)
                and ($entry.gateId == ($issue + "." + $gate))
                and ((string_value($entry.sourceCommit) | test("^[0-9a-fA-F]{40}$")))
                and ((string_value($entry.sourceCommit) | ascii_downcase) == ($commit | ascii_downcase))
                and nonempty_string($entry.provider)
                and ((string_value($entry.provider) | test("github|actions|hosted|runner"; "i")) | not)
                and nonempty_string($entry.hostType)
                and ((string_value($entry.hostType) | test("github|actions|hosted|runner"; "i")) | not)
                and nonempty_string($entry.evidenceId)
                and ($entry.evidenceId == $manifestIssue.evidenceId)
                and nonempty_string($entry.runId)
                and nonempty_string($entry.node)
                and ((string_value($entry.node) | test("github|actions|hosted|runner"; "i")) | not)
                and integer_count($entry.exitCode; false)
                and ($entry.exitCode == 0)
                and (($entry.tests | type) == "object")
                and integer_count($entry.tests.passed; true)
                and integer_count($entry.tests.failed; false)
                and integer_count($entry.tests.ignored; false)
                and ($entry.tests.failed == 0)
                and valid_iso_instant($entry.startedAt)
                and valid_iso_instant($entry.endedAt)
                and valid_iso_order($entry.startedAt; $entry.endedAt)
                and (issue23_selector_value($entry) | nonempty_string(.))
                and nonempty_string($entry.command)
                and issue23_markers_valid(issue23_marker_array($entry))
                and ([ issue23_marker_array($entry)[] |
                       select(test("^CYC-GA-" + ($issue | ascii_upcase) + "\\|gate=" + $gate + "\\|commandSha256=[0-9a-fA-F]{64}\\|status=passed$"))
                     ] | length == 1)
                and (if $issue == "issue3" then issue3_gate_semantics_valid($entry; $gate) else true end)
                and (if ($issue == "issue2" and $gate == "noOpenUnwaivedP0P1Blocker") then
                       (($entry | has("blockerInventory")) and blocker_inventory_valid($entry.blockerInventory))
                     elif ($entry | has("blockerInventory")) then false
                     else true end);
            def issue23_gate_set_valid($record; $issue; $gates; $manifestIssue):
              (($record.gates | type) == "object")
              and (($record.gates | keys_unsorted | sort) == ($gates | sort))
              and ([ $gates[] as $gate |
                     select(issue23_gate_valid($record.gates[$gate]; $issue; $gate; $manifestIssue)
                            and issue23_gate_matches_manifest($record.gates[$gate]; $manifestIssue.gates[$gate]))
                   ] | length == ($gates | length));
            def issue23_gate_evidence_valid($record; $issue; $gates; $manifestIssue):
              (($record.gateEvidence | type) == "array")
              and (($record.gateEvidence | length) == ($gates | length))
              and ([ $gates[] as $gate |
                     select([ $record.gateEvidence[] |
                              select((.gate == $gate)
                                     and issue23_gate_valid(.; $issue; $gate; $manifestIssue)
                                     and issue23_gate_matches_manifest(.; $manifestIssue.gates[$gate]))
                            ] | length == 1)
                   ] | length == ($gates | length));
              def issue23_raw_markers_valid($record; $manifestIssue):
                (issue23_marker_array($record.rawLog)) as $rawMarkers
                | (issue23_markers_valid($rawMarkers)
                   and ([ $manifestIssue.rawLog.markers[] as $marker |
                          select([ $rawMarkers[] | select(. == $marker) ] | length == 1)
                        ] | length == ($manifestIssue.rawLog.markers | length)));
              def issue23_content_valid($content; $issue; $manifestIssue; $gates):
                (issue23_gate_set_valid($content; $issue; $gates; $manifestIssue))
                and issue23_raw_markers_valid({rawLog: $content}; $manifestIssue);
              def valid_issue_evidence($record; $issue; $gates):
                (($record | type) == "object")
                and ($record.status == "passed")
                and (string_value($record.sourceCommit) | test("^[0-9a-fA-F]{40}$"))
                and ((string_value($record.sourceCommit) | ascii_downcase) == ($commit | ascii_downcase))
                and nonempty_string($record.provider)
                and ((string_value($record.provider) | test("github|actions|hosted|runner"; "i")) | not)
                and nonempty_string($record.hostType)
                and ((string_value($record.hostType) | test("github|actions|hosted|runner"; "i")) | not)
                and (string_value($record.evidenceId) | test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"))
                and valid_raw_log($record)
                and gate_keys_exact($record; $gates)
                and (if $issue == "issue2" or $issue == "issue3" then
                       issue23_gate_set_valid($record; $issue; $gates; $record)
                       and issue23_raw_markers_valid($record; $record)
                     else all_gates($record; $gates) end);
              .schemaVersion == "cyc.dev/ga-evidence/v1"
              and .status == "passed"
              and .sourceTag == $tag
              and (string_value(.sourceCommit) | ascii_downcase) == ($commit | ascii_downcase)
              and valid_issue_evidence(.issue2; "issue2"; [
                "tauriDesktopHostTray",
                "rendererNativeControllerProxy",
                "perUserScheduledTasks",
                "sidScopedDataDirAcl",
                "bundledMcpInstallerMarketplace",
                "installRepairUpgradeRollbackUninstall",
                "cleanWindows11Vm",
                "liveWindowsControllerWorkerRoundTrip",
                "productionAuthenticodeSetupHelper",
                "signedNMinus1ToNUpgrade",
                "interruptedUpgradeRollback",
                "downgradePolicy",
                "noOpenUnwaivedP0P1Blocker"
              ])
              and valid_issue_evidence(.issue3; "issue3"; [
                "linuxSystemdUserServicePackage",
                "macosLaunchAgentPackage",
                "linuxX64ReleaseArtifact",
                "macosX64ReleaseArtifact",
                "macosArm64ReleaseArtifact",
                "platformNativeShells",
                "platformNativeProcessGroups",
                "crossPlatformPathAclTests",
                "liveMacosRun",
                "liveLinuxControllerWorkerRoundTrip",
                "macosDeveloperIdSigningNotarization"
              ])
               and valid_issue5(.issue5)
               and ([.issue2.evidenceId, .issue3.evidenceId, .issue5.evidenceId] | unique | length == 3)
               and ([.issue2.rawLog.url, .issue3.rawLog.url, .issue5.rawLog.url] | unique | length == 3)
          JQ
          test -f "$GITHUB_WORKSPACE/scripts/ga-issue3-gate-contract.json"
          jq -e '.schemaVersion == "cyc.dev/ga-issue3-gate-contract/v2" and (.gates | type) == "object"' "$GITHUB_WORKSPACE/scripts/ga-issue3-gate-contract.json" >/dev/null
          jq -e --arg tag "$CYC_GA_SOURCE_TAG" --arg commit "$CYC_GA_SOURCE_COMMIT" \
            --slurpfile issue3contract "$GITHUB_WORKSPACE/scripts/ga-issue3-gate-contract.json" \
            -f "$stable_ga_contract" "$evidence_path" >/dev/null
          echo "GA evidence, issue3/issue5 acceptance gates, and stable release-index are source-bound to $bundle_index_hash" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every stable payload attestation cryptographically
        shell: bash
        run: |
          set -euo pipefail
          index="$CYC_STABLE_BUNDLE_ROOT/release-index.json"
          bundle="$CYC_STABLE_BUNDLE_ROOT/$CYC_STABLE_PROVENANCE_BUNDLE_NAME"
          test -f "$bundle"
          : "${CYC_GA_ATTESTATION_SIGNER_REPO:?missing attestation signer repository input}"
          : "${CYC_GA_ATTESTATION_SIGNER_WORKFLOW:?missing attestation signer workflow input}"
          : "${CYC_GA_ATTESTATION_CERT_IDENTITY:?missing attestation certificate identity input}"
          : "${CYC_GA_ATTESTATION_SIGNER_DIGEST:?missing attestation signer digest input}"
          : "${CYC_GA_TRUSTED_BUILDER_REPO:?missing protected CYC_GA_TRUSTED_BUILDER_REPO production secret}"
          : "${CYC_GA_TRUSTED_BUILDER_WORKFLOW:?missing protected CYC_GA_TRUSTED_BUILDER_WORKFLOW production secret}"
          : "${CYC_GA_TRUSTED_BUILDER_DIGEST:?missing protected CYC_GA_TRUSTED_BUILDER_DIGEST production secret}"
          if [[ ! "$CYC_GA_ATTESTATION_SIGNER_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'attestation signer repository input is not an owner/repository name' >&2
            exit 1
          fi
          if [[ "$CYC_GA_ATTESTATION_SIGNER_REPO" != "$CYC_GA_TRUSTED_BUILDER_REPO" ]]; then
            echo 'attestation signer repository input does not match protected stable-builder policy' >&2
            exit 1
          fi
          if [[ "$CYC_GA_ATTESTATION_SIGNER_REPO" == "$GITHUB_REPOSITORY" ]]; then
            echo 'stable attestation signer must be an external repository' >&2
            exit 1
          fi
          case "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" in
            "$CYC_GA_ATTESTATION_SIGNER_REPO"/.github/workflows/*.yml|"$CYC_GA_ATTESTATION_SIGNER_REPO"/.github/workflows/*.yaml) ;;
            *) echo 'attestation signer workflow input is outside the configured repository workflow directory' >&2; exit 1 ;;
          esac
          if [[ "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" != "$CYC_GA_TRUSTED_BUILDER_WORKFLOW" ]]; then
            echo 'attestation signer workflow input does not match protected stable-builder policy' >&2
            exit 1
          fi
          if [[ ! "$CYC_GA_ATTESTATION_SIGNER_DIGEST" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'attestation signer digest input must be a full 40-character commit SHA' >&2
            exit 1
          fi
          if [[ "$CYC_GA_ATTESTATION_SIGNER_DIGEST" != "$CYC_GA_TRUSTED_BUILDER_DIGEST" ]]; then
            echo 'attestation signer digest input does not match protected stable-builder policy' >&2
            exit 1
          fi
          if [[ "$CYC_GA_TRUSTED_BUILDER_WORKFLOW" == *'..'* ||
                "$CYC_GA_TRUSTED_BUILDER_WORKFLOW" == *[[:space:]]* ]]; then
            echo 'protected stable-builder workflow policy contains unsafe path syntax' >&2
            exit 1
          fi
          if [[ "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" == "$CYC_GA_ATTESTATION_SIGNER_REPO/.github/workflows/release.yml" ||
                "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" == "$CYC_GA_ATTESTATION_SIGNER_REPO/.github/workflows/release.yaml" ]]; then
            echo 'stable attestation signer must be a stable external builder, not prerelease release.yml' >&2
            exit 1
          fi
          signer_workflow_path="${CYC_GA_ATTESTATION_SIGNER_WORKFLOW#"$CYC_GA_ATTESTATION_SIGNER_REPO"/}"
          expected_cert_identity="https://github.com/$CYC_GA_ATTESTATION_SIGNER_REPO/$signer_workflow_path@refs/tags/$CYC_GA_SOURCE_TAG"
          if [[ "$CYC_GA_ATTESTATION_CERT_IDENTITY" != "$expected_cert_identity" ]]; then
            echo 'attestation certificate identity must bind exactly to the signer workflow and stable source tag' >&2
            exit 1
          fi
          attestation_dir="$RUNNER_TEMP/cyc-stable-attestations"
          mkdir -p "$attestation_dir"
          mapfile -t subjects < <(jq -r '.artifacts[].name' "$index")
          [[ ${#subjects[@]} -gt 0 ]]
          for subject in "${subjects[@]}"; do
            output="$attestation_dir/$(printf '%s' "$subject" | sha256sum | awk '{print $1}').json"
            gh attestation verify "$CYC_STABLE_BUNDLE_ROOT/$subject" \
              --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-repo "$CYC_GA_ATTESTATION_SIGNER_REPO" \
              --signer-workflow "$CYC_GA_ATTESTATION_SIGNER_WORKFLOW" \
              --signer-digest "$CYC_GA_ATTESTATION_SIGNER_DIGEST" \
              --cert-identity "$CYC_GA_ATTESTATION_CERT_IDENTITY" \
              --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --deny-self-hosted-runners \
              --source-digest "$CYC_GA_SOURCE_COMMIT" \
              --source-ref "refs/tags/$CYC_GA_SOURCE_TAG" \
              --predicate-type 'https://slsa.dev/provenance/v1' \
              --format json > "$output"
            jq -e 'type == "array" and length > 0' "$output" >/dev/null
          done
          echo "Verified cryptographic provenance for ${#subjects[@]} indexed payload artifacts" >> "$GITHUB_STEP_SUMMARY"

      - name: Revalidate exact-source CI run and required checks
        shell: bash
        run: |
          set -euo pipefail
          ci_dir="$RUNNER_TEMP/cyc-ga-final"
          mkdir -p "$ci_dir"
          [[ "$CYC_GA_SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          ci_run_api="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$CYC_GA_SOURCE_COMMIT&per_page=100"
          ci_run_url="https://api.github.com/$ci_run_api"
          if ! gh api --paginate --slurp "$ci_run_api" > "$ci_dir/ci-run-pages.json"; then
            echo 'failed to snapshot the exact-source CI workflow runs before publish' >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "object" and (.workflow_runs | type == "array") and (.total_count | type == "number"))' "$ci_dir/ci-run-pages.json" >/dev/null; then
            echo 'final CI workflow-run pagination returned an incomplete page envelope' >&2
            exit 1
          fi
          selected_run_id="$(jq -r --arg sha "$CYC_GA_SOURCE_COMMIT" '
            [ .[] | .workflow_runs[]
              | select(.name == "CI" and .path == ".github/workflows/ci.yml"
                       and .head_branch == "main" and .event == "push"
                       and ((.head_sha | ascii_downcase) == ($sha | ascii_downcase)))
            ]
            | sort_by(.run_number, .run_attempt, .updated_at, .id)
            | if length == 0 then empty else .[-1].id end
          ' "$ci_dir/ci-run-pages.json")"
          [[ "$selected_run_id" =~ ^[1-9][0-9]*$ ]]
          ci_jobs_api="repos/$GITHUB_REPOSITORY/actions/runs/$selected_run_id/jobs?per_page=100"
          ci_jobs_url="https://api.github.com/$ci_jobs_api"
          if ! gh api --paginate --slurp "$ci_jobs_api" > "$ci_dir/ci-job-pages.json"; then
            echo 'failed to snapshot the exact-source CI jobs before publish' >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "object" and (.jobs | type == "array") and (.total_count | type == "number"))' "$ci_dir/ci-job-pages.json" >/dev/null; then
            echo 'final CI job pagination returned an incomplete page envelope' >&2
            exit 1
          fi
          ci_checks_api="repos/$GITHUB_REPOSITORY/commits/$CYC_GA_SOURCE_COMMIT/check-runs?per_page=100"
          ci_checks_url="https://api.github.com/$ci_checks_api"
          if ! gh api --paginate --slurp "$ci_checks_api" > "$ci_dir/ci-check-run-pages.json"; then
            echo 'failed to snapshot the exact-source CI check runs before publish' >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "object" and (.check_runs | type == "array") and (.total_count | type == "number"))' "$ci_dir/ci-check-run-pages.json" >/dev/null; then
            echo 'final CI check-run pagination returned an incomplete page envelope' >&2
            exit 1
          fi
          set +e
          ci_proof="$(pwsh -NoLogo -NoProfile -NonInteractive -File ./scripts/Test-GARequiredChecks.ps1 \
            -Repository "$GITHUB_REPOSITORY" \
            -ExpectedCommit "$CYC_GA_SOURCE_COMMIT" \
            -Workflow ci.yml \
            -WorkflowName CI \
            -WorkflowPath .github/workflows/ci.yml \
            -Branch main \
            -Event push \
            -RunListPath "$ci_dir/ci-run-pages.json" \
            -JobsPath "$ci_dir/ci-job-pages.json" \
            -CheckRunsPath "$ci_dir/ci-check-run-pages.json" \
            -Json 2>&1)"
          ci_proof_status=$?
          set -e
          printf '%s\n' "$ci_proof" > "$ci_dir/ci-required-checks.json"
          if (( ci_proof_status != 0 )); then
            cat "$ci_dir/ci-required-checks.json" >&2
            exit "$ci_proof_status"
          fi
          jq -e --arg sha "$CYC_GA_SOURCE_COMMIT" \
            'type == "object" and .status == "passed" and (.sourceCommit | ascii_downcase) == ($sha | ascii_downcase)' \
            "$ci_dir/ci-required-checks.json" >/dev/null
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          proof_sha256="$(sha256sum "$ci_dir/ci-required-checks.json" | awk '{print tolower($1)}')"
          jq -S -n \
            --arg schemaVersion 'cyc.dev/ga-ci-runs/v1' \
            --arg commit "$CYC_GA_SOURCE_COMMIT" \
            --arg capturedAt "$captured_at" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runEndpoint "$ci_run_url" \
            --arg jobsEndpoint "$ci_jobs_url" \
            --arg checkRunsEndpoint "$ci_checks_url" \
            --arg proofSha256 "$proof_sha256" \
            --argjson runId "$selected_run_id" \
            --slurpfile proof "$ci_dir/ci-required-checks.json" \
            '{schemaVersion: $schemaVersion, sourceCommit: $commit, capturedAt: $capturedAt,
              repository: $repository,
              workflow: {name: "CI", path: ".github/workflows/ci.yml", branch: "main", event: "push", runId: $runId},
              api: {provider: "github-rest-api", complete: true, incomplete: false, hasNextPage: false,
                    runEndpoint: $runEndpoint, jobsEndpoint: $jobsEndpoint, checkRunsEndpoint: $checkRunsEndpoint},
              proofSha256: $proofSha256, proof: $proof[0]}' \
            > "$ci_dir/ci-snapshot.json"
          jq -e --arg sha "$CYC_GA_SOURCE_COMMIT" \
            'type == "object" and .schemaVersion == "cyc.dev/ga-ci-runs/v1" and
             (.sourceCommit | ascii_downcase) == ($sha | ascii_downcase) and
             .api.provider == "github-rest-api" and .api.complete == true and
             .api.incomplete == false and .api.hasNextPage == false and
             .proof.status == "passed"' \
            "$ci_dir/ci-snapshot.json" >/dev/null
          ci_snapshot_sha256="$(sha256sum "$ci_dir/ci-snapshot.json" | awk '{print tolower($1)}')"
          printf 'CYC_GA_FINAL_CI_SNAPSHOT_PATH=%s\n' "$ci_dir/ci-snapshot.json" >> "$GITHUB_ENV"
          printf 'CYC_GA_FINAL_CI_SNAPSHOT_SHA256=%s\n' "$ci_snapshot_sha256" >> "$GITHUB_ENV"
          printf 'CYC_GA_FINAL_CI_PROOF_PATH=%s\n' "$ci_dir/ci-required-checks.json" >> "$GITHUB_ENV"
          {
            echo "Final exact-source CI proof: run $selected_run_id, commit $CYC_GA_SOURCE_COMMIT"
            echo "Final required checks: $(jq -r '.counts.passed' "$ci_dir/ci-required-checks.json")"
            echo "Final CI snapshot SHA-256: $ci_snapshot_sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revalidate final governance, issues, tag, and release state before publish
        shell: bash
        run: |
          set -euo pipefail
          final_gate_dir="$RUNNER_TEMP/cyc-ga-final"
          mkdir -p "$final_gate_dir"
          gh_governance_api() {
            if [[ -n "${CYC_GA_GOVERNANCE_TOKEN:-}" ]]; then
              GH_TOKEN="$CYC_GA_GOVERNANCE_TOKEN" gh api "$@"
            else
              gh api "$@"
            fi
          }
          for number in 2 3 5; do
            if gh api "repos/$GITHUB_REPOSITORY/issues/$number" > "$final_gate_dir/issue-$number.json"; then
              :
            else
              printf '{"number":%s,"state":"api-error"}\n' "$number" > "$final_gate_dir/issue-$number.json"
            fi
          done
          jq -n \
            --slurpfile issue2 "$final_gate_dir/issue-2.json" \
            --slurpfile issue3 "$final_gate_dir/issue-3.json" \
            --slurpfile issue5 "$final_gate_dir/issue-5.json" \
            '{issues: [$issue2[0], $issue3[0], $issue5[0]]}' \
            > "$final_gate_dir/issues.json"

          # Reconcile the complete open-issue inventory again immediately
          # before publication. A stale externally captured blocker inventory
          # must never survive the final governance check.
          open_issue_endpoint="https://api.github.com/repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100"
          if ! gh api --paginate --slurp "$open_issue_endpoint" > "$final_gate_dir/open-issue-pages.json"; then
            echo 'failed to snapshot the complete open-issue collection before publish' >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and all(.[]; type == "array")' "$final_gate_dir/open-issue-pages.json" >/dev/null; then
            echo 'final open-issue API pagination returned an incomplete page envelope' >&2
            exit 1
          fi
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -S -n \
            --arg commit "$CYC_GA_SOURCE_COMMIT" \
            --arg capturedAt "$captured_at" \
            --arg endpoint "$open_issue_endpoint" \
            --slurpfile pages "$final_gate_dir/open-issue-pages.json" \
            '
              ($pages[0]) as $pageArrays
              | [ $pageArrays[] | .[]
                  | select((has("pull_request") | not))
                  | {number, state, title, html_url, labels: [ .labels[]? | {name} ]}
                ] as $issues
              | {schemaVersion: "cyc.dev/ga-open-issue-snapshot/v1",
                 sourceCommit: $commit,
                 capturedAt: $capturedAt,
                 api: {provider: "github-rest-api", endpoint: $endpoint,
                       requestedState: "open", complete: true, incomplete: false,
                       hasNextPage: false, pageCount: ($pageArrays | length),
                       totalCount: ($issues | length), returnedCount: ($issues | length),
                       capturedAt: $capturedAt, sourceCommit: $commit, error: null},
                 issues: $issues}
            ' > "$final_gate_dir/open-issues.json"

          if gh api "repos/$GITHUB_REPOSITORY" > "$final_gate_dir/repository.json"; then
            :
          else
            printf '{"default_branch":"","apiError":true}\n' > "$final_gate_dir/repository.json"
          fi
          default_branch="$(jq -r '.default_branch // empty' "$final_gate_dir/repository.json")"
          if [[ -z "$default_branch" ]]; then
            echo 'final repository snapshot did not provide a default branch' >&2
            exit 1
          fi
          encoded_branch="$(jq -rn --arg branch "$default_branch" '$branch | @uri')"
          if gh api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch" > "$final_gate_dir/branch.json"; then
            :
          else
            printf '{"name":"","protected":false,"protection":{"enabled":false},"apiError":true}\n' > "$final_gate_dir/branch.json"
          fi
          if gh_governance_api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch/protection" > "$final_gate_dir/branch-protection.json"; then
            :
          else
            printf '{"allow_force_pushes":{"enabled":true},"allow_deletions":{"enabled":true},"enforce_admins":{"enabled":false},"apiError":true}\n' > "$final_gate_dir/branch-protection.json"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$final_gate_dir/production-environment.json"; then
            :
          else
            printf '{"name":"production","can_admins_bypass":true,"protection_rules":[],"apiError":true}\n' > "$final_gate_dir/production-environment.json"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" > "$final_gate_dir/deployment-policies.json"; then
            :
          else
            printf '{"branch_policies":[],"apiError":true}\n' > "$final_gate_dir/deployment-policies.json"
          fi
          jq -S -n \
            --arg defaultBranch "$default_branch" \
            --slurpfile branch "$final_gate_dir/branch.json" \
            --slurpfile branchProtection "$final_gate_dir/branch-protection.json" \
            --slurpfile environment "$final_gate_dir/production-environment.json" \
            --slurpfile policies "$final_gate_dir/deployment-policies.json" \
            '{defaultBranch: $defaultBranch, branchProtection: ($branch[0] + {protectionDetails: $branchProtection[0]}), productionEnvironment: $environment[0], deploymentBranchPolicies: $policies[0]}' \
            > "$final_gate_dir/controls.json"
          final_snapshot="$final_gate_dir/final-snapshot.json"
          jq -S -n \
            --arg schemaVersion 'cyc.dev/ga-final-snapshot/v1' \
            --arg tag "$CYC_GA_SOURCE_TAG" \
            --arg commit "$CYC_GA_SOURCE_COMMIT" \
            --arg indexSha256 "$CYC_STABLE_INDEX_SHA256" \
            --arg bundleSha256 "$CYC_STABLE_ASSET_SHA256" \
            --arg evidenceSha256 "$CYC_GA_EVIDENCE_SHA256" \
            --arg ciSnapshotSha256 "$CYC_GA_FINAL_CI_SNAPSHOT_SHA256" \
            --arg blockerSnapshotSha256 "$(sha256sum "$final_gate_dir/open-issues.json" | awk '{print tolower($1)}')" \
            --slurpfile issues "$final_gate_dir/issues.json" \
            --slurpfile controls "$final_gate_dir/controls.json" \
            '{schemaVersion: $schemaVersion, sourceTag: $tag, sourceCommit: $commit, stableIndexSha256: $indexSha256, stableBundleSha256: $bundleSha256, evidenceSha256: $evidenceSha256, ciSnapshotSha256: $ciSnapshotSha256, blockerSnapshotSha256: $blockerSnapshotSha256, issues: $issues[0], controls: $controls[0]}' \
            > "$final_snapshot"
          final_snapshot_hash="$(sha256sum "$final_snapshot" | awk '{print tolower($1)}')"
          printf 'CYC_GA_FINAL_SNAPSHOT_PATH=%s\n' "$final_snapshot" >> "$GITHUB_ENV"
          printf 'CYC_GA_FINAL_SNAPSHOT_SHA256=%s\n' "$final_snapshot_hash" >> "$GITHUB_ENV"

          set +e
          final_result="$(pwsh -NoLogo -NoProfile -File "$GITHUB_WORKSPACE/scripts/Test-GAReadiness.ps1" \
            -RepositoryRoot "$GITHUB_WORKSPACE" \
            -ExpectedTag "$CYC_GA_SOURCE_TAG" \
            -ExpectedCommit "$CYC_GA_SOURCE_COMMIT" \
            -EvidencePath "$RUNNER_TEMP/cyc-ga-evidence.json" \
            -RawLogVerificationPath "$CYC_GA_RAW_LOG_VERIFICATION_PATH" \
            -IssueSnapshotPath "$final_gate_dir/issues.json" \
            -LiveBlockerSnapshotPath "$final_gate_dir/open-issues.json" \
            -ControlsPath "$final_gate_dir/controls.json" \
            -Json 2>&1)"
          final_result_status=$?
          set -e
          printf '%s\n' "$final_result" > "$final_gate_dir/ga-readiness-final.json"
          if (( final_result_status != 0 )); then
            cat "$final_gate_dir/ga-readiness-final.json" >&2
            exit "$final_result_status"
          fi

          resolve_remote_tag_identity() {
            local tag="$1"
            local encoded_tag ref_json object_type object_sha tag_json depth tag_object_sha
            encoded_tag="$(jq -rn --arg tag "$tag" '$tag | @uri')"
            if ! ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded_tag")"; then
              return 1
            fi
            object_type="$(jq -r '.object.type // empty' <<< "$ref_json")"
            object_sha="$(jq -r '.object.sha // empty' <<< "$ref_json")"
            [[ "$object_type" == 'tag' ]] || return 1
            [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            tag_object_sha="$object_sha"
            for depth in 1 2 3 4; do
              case "$object_type" in
                commit)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  printf '%s %s\n' "$tag_object_sha" "$object_sha"
                  return 0
                  ;;
                tag)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  if ! tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"; then
                    return 1
                  fi
                  object_type="$(jq -r '.object.type // empty' <<< "$tag_json")"
                  object_sha="$(jq -r '.object.sha // empty' <<< "$tag_json")"
                  ;;
                *)
                  return 1
                  ;;
              esac
            done
            return 1
          }
          if ! remote_tag_identity="$(resolve_remote_tag_identity "$CYC_GA_SOURCE_TAG")"; then
            echo 'unable to resolve the remote stable annotated tag before publish' >&2
            exit 1
          fi
          read -r remote_tag_object remote_tag_commit <<< "$remote_tag_identity"
          test "$(printf '%s' "$remote_tag_object" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_TAG_OBJECT" | tr '[:upper:]' '[:lower:]')"
          test "$(printf '%s' "$remote_tag_commit" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_COMMIT" | tr '[:upper:]' '[:lower:]')"

          release_probe="$final_gate_dir/release-probe.txt"
          release_probe_error="$final_gate_dir/release-probe.err"
          encoded_tag="$(jq -rn --arg tag "$CYC_GA_SOURCE_TAG" '$tag | @uri')"
          set +e
          gh release view "$CYC_GA_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2> "$release_probe_error"
          release_view_status=$?
          set -e
          if (( release_view_status == 0 )); then
            echo "stable release already exists for $CYC_GA_SOURCE_TAG" >&2
            exit 1
          fi
          set +e
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag" > "$release_probe" 2>> "$release_probe_error"
          release_api_status=$?
          set -e
          release_http_status="$(awk '$1 ~ /^HTTP\// {status=$2} END {print status}' "$release_probe")"
          if [[ "$release_api_status" -eq 0 || "$release_http_status" != '404' ]]; then
            echo "stable release lookup did not return an unambiguous HTTP 404" >&2
            cat "$release_probe_error" >&2
            exit 1
          fi
          {
            echo "Final GA snapshot SHA-256: $final_snapshot_hash"
            echo "Remote stable tag resolves to reviewed commit: $CYC_GA_SOURCE_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish true stable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t asset_names < <(
            jq -r '.artifacts[] | .name, .sidecar' "$CYC_STABLE_BUNDLE_ROOT/release-index.json"
            printf '%s\n' 'release-index.json' 'release-index.json.sha256' 'release-index.json.sig' 'SHA256SUMS'
          )
          assets=()
          for name in "${asset_names[@]}"; do
            test -f "$CYC_STABLE_BUNDLE_ROOT/$name"
            assets+=("$CYC_STABLE_BUNDLE_ROOT/$name")
          done
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo 'stable asset bundle contains no publishable files' >&2
            exit 1
          fi
          # Re-resolve the remote annotated tag immediately before the
          # side-effecting release create.  The ga-readiness job verified the
          # tag earlier, but a mutable tag could otherwise be moved between
          # jobs (TOCTOU) while --verify-tag only proves that the name exists.
          resolve_remote_tag_identity() {
            local tag="$1"
            local encoded_tag ref_json object_type object_sha tag_json depth tag_object_sha
            encoded_tag="$(jq -rn --arg tag "$tag" '$tag | @uri')"
            if ! ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded_tag")"; then
              return 1
            fi
            object_type="$(jq -r '.object.type // empty' <<< "$ref_json")"
            object_sha="$(jq -r '.object.sha // empty' <<< "$ref_json")"
            [[ "$object_type" == 'tag' ]] || return 1
            [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            tag_object_sha="$object_sha"
            for depth in 1 2 3 4; do
              case "$object_type" in
                commit)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  printf '%s %s\n' "$tag_object_sha" "$object_sha"
                  return 0
                  ;;
                tag)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  if ! tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"; then
                    return 1
                  fi
                  object_type="$(jq -r '.object.type // empty' <<< "$tag_json")"
                  object_sha="$(jq -r '.object.sha // empty' <<< "$tag_json")"
                  ;;
                *)
                  return 1
                  ;;
              esac
            done
            return 1
          }
          if ! pre_publish_tag_identity="$(resolve_remote_tag_identity "$CYC_GA_SOURCE_TAG")"; then
            echo 'unable to resolve the stable annotated tag immediately before publish' >&2
            exit 1
          fi
          read -r pre_publish_tag_object pre_publish_tag_commit <<< "$pre_publish_tag_identity"
          test "$(printf '%s' "$pre_publish_tag_object" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_TAG_OBJECT" | tr '[:upper:]' '[:lower:]')"
          test "$(printf '%s' "$pre_publish_tag_commit" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_COMMIT" | tr '[:upper:]' '[:lower:]')"
          # No --prerelease flag is supplied: this job is the only path that
          # creates a stable release, and it runs behind the production gate.
          gh release create "$CYC_GA_SOURCE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "ClusterYourCodex $CYC_GA_SOURCE_TAG" \
            --notes "GA final governance/issues snapshot SHA-256: $CYC_GA_FINAL_SNAPSHOT_SHA256" \
            --generate-notes
      - name: Re-download and verify published stable assets and tag
        shell: bash
        run: |
          set -euo pipefail
          post_dir="$RUNNER_TEMP/cyc-stable-release-download"
          rm -rf "$post_dir"
          mkdir -p "$post_dir"
          gh release download "$CYC_GA_SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$post_dir" \
            --clobber
          if find "$post_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo 'downloaded stable release contains a directory or non-regular file' >&2
            exit 1
          fi
          expected_assets="$RUNNER_TEMP/cyc-stable-release-expected-assets.txt"
          actual_assets="$RUNNER_TEMP/cyc-stable-release-actual-assets.txt"
          jq -er '.artifacts[] | .name, .sidecar' "$CYC_STABLE_BUNDLE_ROOT/release-index.json" > "$expected_assets"
          printf '%s\n' 'release-index.json' 'release-index.json.sha256' 'release-index.json.sig' 'SHA256SUMS' >> "$expected_assets"
          LC_ALL=C sort -u -o "$expected_assets" "$expected_assets"
          find "$post_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort -u > "$actual_assets"
          if ! cmp -s "$expected_assets" "$actual_assets"; then
            echo 'published stable release asset set differs from the validated stable bundle' >&2
            exit 1
          fi
          while IFS= read -r name; do
            test -f "$post_dir/$name"
            test -f "$CYC_STABLE_BUNDLE_ROOT/$name"
            if ! cmp -s "$post_dir/$name" "$CYC_STABLE_BUNDLE_ROOT/$name"; then
              echo "published stable asset differs from the validated bundle: $name" >&2
              exit 1
            fi
          done < "$expected_assets"
          downloaded_index_hash="$(sha256sum "$post_dir/release-index.json" | awk '{print tolower($1)}')"
          test "$downloaded_index_hash" = "$(printf '%s' "$CYC_STABLE_INDEX_SHA256" | tr '[:upper:]' '[:lower:]')"
          release_json="$(gh release view "$CYC_GA_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft,tagName,body)"
          jq -e --arg tag "$CYC_GA_SOURCE_TAG" --arg snapshot "$CYC_GA_FINAL_SNAPSHOT_SHA256" \
            '.tagName == $tag and .isPrerelease == false and .isDraft == false and (.body | contains("GA final governance/issues snapshot SHA-256: " + $snapshot))' \
            <<< "$release_json" >/dev/null

          resolve_remote_tag_identity() {
            local tag="$1"
            local encoded_tag ref_json object_type object_sha tag_json depth tag_object_sha
            encoded_tag="$(jq -rn --arg tag "$tag" '$tag | @uri')"
            if ! ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded_tag")"; then
              return 1
            fi
            object_type="$(jq -r '.object.type // empty' <<< "$ref_json")"
            object_sha="$(jq -r '.object.sha // empty' <<< "$ref_json")"
            [[ "$object_type" == 'tag' ]] || return 1
            [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            tag_object_sha="$object_sha"
            for depth in 1 2 3 4; do
              case "$object_type" in
                commit)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  printf '%s %s\n' "$tag_object_sha" "$object_sha"
                  return 0
                  ;;
                tag)
                  [[ "$object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
                  if ! tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"; then
                    return 1
                  fi
                  object_type="$(jq -r '.object.type // empty' <<< "$tag_json")"
                  object_sha="$(jq -r '.object.sha // empty' <<< "$tag_json")"
                  ;;
                *)
                  return 1
                  ;;
              esac
            done
            return 1
          }
          if ! remote_tag_identity="$(resolve_remote_tag_identity "$CYC_GA_SOURCE_TAG")"; then
            echo 'unable to resolve the published stable annotated tag' >&2
            exit 1
          fi
          read -r remote_tag_object remote_tag_commit <<< "$remote_tag_identity"
          test "$(printf '%s' "$remote_tag_object" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_TAG_OBJECT" | tr '[:upper:]' '[:lower:]')"
          test "$(printf '%s' "$remote_tag_commit" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$CYC_GA_SOURCE_COMMIT" | tr '[:upper:]' '[:lower:]')"
          echo "Published stable release assets and index re-verified; tag commit is $CYC_GA_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
