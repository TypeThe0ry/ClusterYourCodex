name: Dependency security

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace
            lockfile: Cargo.lock
          - name: desktop-host
            lockfile: apps/desktop/src-tauri/Cargo.lock
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Reject known Rust vulnerabilities
        run: cargo audit --file "${{ matrix.lockfile }}"

  cargo-deny:
    name: Cargo deny (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace
            manifest: ./Cargo.toml
          - name: desktop-host
            manifest: ./apps/desktop/src-tauri/Cargo.toml
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --workspace --all-features
          command: check

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.8
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Test OSV fallback parser
        run: python3 -m unittest scripts/test_npm_osv_fallback_tests.py
      - name: Reject known moderate or higher advisories
        shell: bash
        run: |
          set -o pipefail
          audit_log="${RUNNER_TEMP}/clusteryourcodex-pnpm-audit.log"
          set +e
          pnpm audit --audit-level moderate 2>&1 | tee "${audit_log}"
          audit_exit=${PIPESTATUS[0]}
          set -e
          if [ "${audit_exit}" -eq 0 ]; then
            exit 0
          fi
          if ! grep -Eqi 'error \([0-9]+\)|operation was aborted due to timeout|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ENOTFOUND|socket hang up|fetch failed|ERR_PNPM_(FETCH|META_FETCH)' "${audit_log}"; then
            echo "pnpm audit failed for a non-network reason; preserving the strict failure"
            exit "${audit_exit}"
          fi
          inventory="${RUNNER_TEMP}/clusteryourcodex-pnpm-inventory.json"
          pnpm list --json --depth Infinity > "${inventory}"
          set +e
          python3 scripts/test_npm_osv_fallback.py --inventory "${inventory}"
          fallback_exit=$?
          set -e
          if [ "${fallback_exit}" -ne 0 ]; then
            echo "OSV fallback did not produce a clean advisory result; failing closed"
            exit "${fallback_exit}"
          fi
          echo "::warning::pnpm audit advisory endpoint was unavailable; strict OSV fallback passed"
