<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ClusterYourCodex execution flow</title>
  <desc id="desc">Codex sends typed requirements to the native plugin and controller, which reserves a compatible worker and returns verified artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="56" y="58" fill="#bfdbfe" font-family="Segoe UI,Arial" font-size="26" font-weight="700">One request · current telemetry · verified result</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle">
    <g transform="translate(55 115)"><rect width="190" height="125" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="95" y="45" fill="#fff" font-size="21" font-weight="700">Codex</text><text x="95" y="78" fill="#bfdbfe" font-size="15">typed requirements</text><text x="95" y="101" fill="#bfdbfe" font-size="15">build · test · batch</text></g>
    <g transform="translate(300 115)"><rect width="210" height="125" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/><text x="105" y="45" fill="#fff" font-size="21" font-weight="700">Native plugin</text><text x="105" y="78" fill="#bfdbfe" font-size="15">MCP bridge</text><text x="105" y="101" fill="#bfdbfe" font-size="15">credentials stay native</text></g>
    <g transform="translate(565 115)"><rect width="210" height="125" rx="18" fill="url(#card)" stroke="#34d399" stroke-width="2"/><text x="105" y="45" fill="#fff" font-size="21" font-weight="700">Controller</text><text x="105" y="78" fill="#bbf7d0" font-size="15">telemetry + reservations</text><text x="105" y="101" fill="#bbf7d0" font-size="15">explainable placement</text></g>
    <g transform="translate(830 115)"><rect width="160" height="125" rx="18" fill="url(#card)" stroke="#34d399" stroke-width="2"/><text x="80" y="45" fill="#fff" font-size="21" font-weight="700">Worker</text><text x="80" y="78" fill="#bbf7d0" font-size="15">Windows · Linux</text><text x="80" y="101" fill="#bbf7d0" font-size="15">macOS kits</text></g>
    <g transform="translate(1045 115)"><rect width="100" height="125" rx="18" fill="#064e3b" stroke="#6ee7b7" stroke-width="2"/><text x="50" y="43" fill="#ecfdf5" font-size="18" font-weight="700">Proof</text><text x="50" y="72" fill="#bbf7d0" font-size="13">exit</text><text x="50" y="91" fill="#bbf7d0" font-size="13">logs</text><text x="50" y="110" fill="#bbf7d0" font-size="13">SHA-256</text></g>
  </g>
  <g stroke="#93c5fd" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M245 178 H292"/><path d="M510 178 H557"/><path d="M775 178 H822"/><path d="M990 178 H1037"/></g>
</svg>
