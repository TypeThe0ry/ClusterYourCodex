[workspace]
resolver = "2"
members = [
  "crates/cyc-protocol",
  "crates/cyc-scheduler",
  "crates/cyc-controller",
  "crates/cyc-worker",
  "crates/cyc-cli",
  "crates/cyc-secrets",
  "crates/cyc-ssh",
  "crates/cyc-provision",
]

[workspace.package]
version = "0.1.0-preview.72"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TypeThe0ry/ClusterYourCodex"
rust-version = "1.88.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ssh2 = { version = "0.9", default-features = false }
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
zeroize = "1.8"
